<header><h1>⚓ Navibar</h1><nav id="nav"></nav><span id="gh" style="margin-left:auto"></span><span id="acct"></span><span id="bk"></span><span id="tm"></span><span id="who" style="display:flex;gap:8px;align-items:center"></span></header>

<script>
/* ===== SUPABASE-ZUGANG – hier einmal eintragen (Project Settings -> API) =====
   Der "anon/publishable"-Key ist öffentlich gedacht. Geschützt sind die Daten durch Login und Zugriffsregeln.
   NIE den "service_role"-Key hier eintragen. Der Admin kann diese Werte in der Kasse nicht ändern. */
const NBCFG={url:'https://DEIN-PROJEKT.supabase.co',key:'DEIN-ANON-KEY'};
NBCFG.url=NBCFG.url.trim().replace(/\/+$/,'').replace(/\/(rest|auth)\/v1$/,'');NBCFG.key=NBCFG.key.trim();   // schadet nicht, falls ein Schrägstrich am Ende oder ein Pfad mitkopiert wurde
/* ===== QR-Encoder (Byte-Modus, ECC L, Version 1-20, Maske 0) – komplett offline ===== */
const QR=(()=>{
const EC=[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28],NB=[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8];
const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r};
const cap=v=>Math.floor(raw(v)/8)-EC[v-1]*NB[v-1];
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>7)*0x11d);z^=((y>>i)&1)*x}return z};
function rs(d,n){let g=[1];let r=1;for(let i=0;i<n;i++){const h=g.concat(0);for(let j=0;j<g.length;j++){h[j]=mul(g[j],r);if(j+1<h.length)h[j+1]^=g[j]}
 // multiply g by (x - r)
 g=[...Array(g.length+1)].map((_,k)=>(k<g.length?g[k]:0)^(k>0?mul(g[k-1],r):0));r=mul(r,2)}
 g=g.slice(1);// leading coeff 1 removed
 const res=new Array(n).fill(0);
 for(const b of d){const f=b^res.shift();res.push(0);g.forEach((c,i)=>res[i]^=mul(c,f))}return res}
function make(text){
 const by=[...new TextEncoder().encode(text)];let v=1;while(v<=20&&cap(v)*8<4+(v<10?8:16)+8*by.length)v++;
 if(v>20)throw 0;
 let bits=[];const put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>i)&1)};
 put(4,4);put(by.length,v<10?8:16);by.forEach(b=>put(b,8));
 const cw=cap(v)*8;put(0,Math.min(4,cw-bits.length));while(bits.length%8)bits.push(0);
 const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
 for(let p=0xec;data.length<cap(v);p^=0xfd)data.push(p);
 const nb=NB[v-1],ec=EC[v-1],rc=Math.floor(raw(v)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb);
 const blocks=[];for(let i=0,k=0;i<nb;i++){const dl=sl-ec+(i<ns?0:1);const d=data.slice(k,k+dl);k+=dl;const e=rs(d,ec);if(i<ns)d.push(0);blocks.push(d.concat(e))}
 const out=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-ec||j>=ns)out.push(b[i])});
 const S=v*4+17,M=[...Array(S)].map(()=>Array(S).fill(false)),F=[...Array(S)].map(()=>Array(S).fill(false));
 const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
 for(let i=0;i<S;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
 const fin=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy,d=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&y>=0&&x<S&&y<S)set(x,y,d!=2&&d!=4)}};
 fin(3,3);fin(S-4,3);fin(3,S-4);
 if(v>1){const n=Math.floor(v/7)+2,st=Math.ceil((v*4+4)/(n*2-2))*2,p=[6];for(let q=S-7;p.length<n;q-=st)p.splice(1,0,q);
  p.forEach((a,i)=>p.forEach((b,j)=>{if((i==0&&j==0)||(i==0&&j==n-1)||(i==n-1&&j==0))return;
   for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}))}
 // Formatbits (ECC L, Maske 0)
 let d=8,r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>9)*0x537);const fb=((d<<10)|r)^0x5412,g=i=>((fb>>i)&1)==1;
 for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
 for(let i=0;i<8;i++)set(S-1-i,8,g(i));for(let i=8;i<15;i++)set(8,S-15+i,g(i));set(8,S-8,true);
 if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>11)*0x1f25);const vb=(v<<12)|r;for(let i=0;i<18;i++){const b=((vb>>i)&1)==1,a=S-11+i%3,c=Math.floor(i/3);set(a,c,b);set(c,a,b)}}
 let i=0;for(let right=S-1;right>=1;right-=2){if(right==6)right=5;for(let vert=0;vert<S;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)==0,y=up?S-1-vert:vert;
  if(!F[y][x]&&i<out.length*8){M[y][x]=((out[i>>3]>>(7-(i&7)))&1)==1;i++}}}
 for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(!F[y][x]&&(x+y)%2==0)M[y][x]=!M[y][x];
 return M}
function draw(text){const M=make(text),c=document.createElement('canvas'),k=Math.max(3,Math.floor(380/(M.length+8))),n=(M.length+8)*k;c.width=c.height=n;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,n,n);x.fillStyle='#000';M.forEach((r,y)=>r.forEach((d,i)=>d&&x.fillRect((i+4)*k,(y+4)*k,k,k)));return c}
return{draw}})();

/* --- Unterschiede -> Aufträge (Outbox) --- */
const RANK={cats:0,drinks:1,vouchers:2,cashiers:3,customers:4,entries:5,settings:6};
function diff(A,B){const ops=[],same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
 for(const t of Object.keys(RANK)){
  for(const id in B[t]){const n=B[t][id],o=A[t][id];
   if(!o)ops.push({t:t=='settings'?'ups':'ins',tb:t,row:n});
   else if(!same(o,n)){const pt={};for(const k in n)if(!same(n[k],o[k]))pt[k]=n[k];if(t=='customers')delete pt.no;
    if(Object.keys(pt).length)ops.push(t=='settings'?{t:'ups',tb:t,row:n}:{t:'upd',tb:t,key:id,patch:pt})}}
  for(const id in A[t])if(!(id in B[t])){if(t=='entries'&&!(A.entries[id].customer_id in B.customers))continue;ops.push({t:'del',tb:t,key:id})}}
 const ph={ins:0,ups:1,upd:1,del:2};return ops.map((o,i)=>[o,i]).sort((a,b)=>ph[a[0].t]-ph[b[0].t]||(a[0].t=='ins'?RANK[a[0].tb]-RANK[b[0].tb]:0)||a[1]-b[1]).map(x=>x[0])}
const save=()=>{if(!DB.ready||!DB.LAST)return;const R=toRows(),ops=diff(DB.LAST,R);DB.LAST=R;
 if(ops.length){DB.OUT.push(...ops);persistOut();DB.state=navigator.onLine===false?'offline':'sync';dbUi();pump()}};
/* --- Server-Stand + vorgemerkte Aufträge = angezeigter Stand --- */
function rowsOf(snap){const R={};for(const t of Object.keys(TB))R[t]={};
 ['customers','entries','drinks','cats','vouchers','cashiers'].forEach(t=>(snap[t]||[]).forEach(r=>R[t][r.id]=r));(snap.settings||[]).forEach(r=>R.settings[r.key]=r);return R}
function applyOp(R,op){const t=op.tb,k=t=='settings'?'key':'id';
 if(op.t=='ins'||op.t=='ups')R[t][op.row[k]]=JSON.parse(JSON.stringify(op.row));
 else if(op.t=='upd'){if(R[t][op.key])Object.assign(R[t][op.key],op.patch)}
 else if(op.t=='del'){delete R[t][op.key];if(t=='customers')for(const id in R.entries)if(R.entries[id].customer_id==op.key)delete R.entries[id]}}
function rebuild(){const R=rowsOf(DB.SRV);DB.OUT.forEach(o=>applyOp(R,o));fromRows(R);DB.LAST=toRows()}
function srvApply(op){const t=op.tb,k=t=='settings'?'key':'id',a=DB.SRV[t]=DB.SRV[t]||[];
 if(op.t=='ins'||op.t=='ups'){const i=a.findIndex(r=>r[k]==op.row[k]);i<0?a.push(JSON.parse(JSON.stringify(op.row))):a[i]=JSON.parse(JSON.stringify(op.row))}
 else if(op.t=='upd'){const r=a.find(x=>x[k]==op.key);if(r)Object.assign(r,op.patch)}
 else if(op.t=='del'){DB.SRV[t]=a.filter(r=>r[k]!=op.key);if(t=='customers')DB.SRV.entries=(DB.SRV.entries||[]).filter(e=>e.customer_id!=op.key)}

async function opSend(op){const U=NBCFG.url+'/rest/v1/'+TB[op.tb];
 const hd=async x=>({apikey:NBCFG.key,Authorization:'Bearer '+await auToken(),'Content-Type':'application/json',...x});
 const go=async()=>{
  if(op.t=='ins')return fetch(U,{method:'POST',headers:await hd({Prefer:'resolution=ignore-duplicates,return=minimal'}),body:JSON.stringify(op.row)});
  if(op.t=='ups')return fetch(U+'?on_conflict=key',{method:'POST',headers:await hd({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(op.row)});
  if(op.t=='upd')return fetch(U+'?id=eq.'+encodeURIComponent(op.key),{method:'PATCH',headers:await hd({Prefer:'return=representation'}),body:JSON.stringify(op.patch)});
  return fetch(U+'?id=eq.'+encodeURIComponent(op.key),{method:'DELETE',headers:await hd({Prefer:'return=representation'})})};

   if(r.ok){let zero=false;if(op.t=='upd'||op.t=='del'){const b=await r.json().catch(()=>null);zero=Array.isArray(b)&&!b.length}
   DB.OUT.shift();DB.opsDone++;persistOut();if(zero){rejected=true;(DB.chk=DB.chk||[]).push({tb:op.tb,key:op.key})}else srvApply(op)}
   else if(r.status>=500||r.status==408||r.status==429){DB.state='offline';DB.err='Server '+r.status;clearTimeout(pumpTimer);pumpTimer=setTimeout(pump,8000);return}
   else{const tx=await r.text().catch(()=>'');DB.OUT.shift();persistOut();rejected=true;opRejected(op,r.status,tx)}}
  DB.state='ok';DB.err=''}

 ws.onopen=async()=>{try{const tok=await auToken();ws.send(JSON.stringify({topic:'realtime:nb',event:'phx_join',ref:'1',join_ref:'1',payload:{config:{broadcast:{ack:false,self:false},presence:{key:''},private:false,
   postgres_changes:['nb_customers','nb_entries','nb_drinks','nb_cats','nb_vouchers','nb_cashiers','nb_settings','nb_archive','nb_print_jobs'].map(t=>({event:'*',schema:'public',table:t}))},access_token:tok}}));
  RT.hb=setInterval(()=>{if(ws.readyState==1)ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:String(++RT.ref)}))},25000)}catch(e){}};
 ws.onmessage=m=>{let j;try{j=JSON.parse(m.data)}catch(e){return}
  if(j.topic=='realtime:nb'&&j.event=='phx_reply'){RT.ok=!!(j.payload&&j.payload.status=='ok');dbUi()}
  else if(j.event=='postgres_changes'){const t=j.payload&&j.payload.data&&j.payload.data.table;rtEvent(t)}
  else if(j.event=='system'&&j.payload&&j.payload.status=='error'){RT.ok=false}};
 ws.onclose=()=>{RT.ok=false;clearInterval(RT.hb);RT.ws=null;dbUi();rtLater()};ws.onerror=()=>{try{ws.close()}catch(e){}}}
function rtLater(){clearTimeout(RT.rt);if(AUTH.s)RT.rt=setTimeout(rtStart,8000)}
function rtStop(){clearTimeout(RT.rt);clearInterval(RT.hb);RT.ok=false;const w=RT.ws;RT.ws=null;if(w){w.onclose=null;try{w.close()}catch(e){}}}
function rtToken(){if(RT.ws&&RT.ws.readyState==1&&AUTH.s)RT.ws.send(JSON.stringify({topic:'realtime:nb',event:'access_token',payload:{access_token:AUTH.s.at},ref:String(++RT.ref)}))}
function rtEvent(t){if(t=='nb_print_jobs'){if(DEV.station)stPoll();return}clearTimeout(RT.ev);RT.ev=setTimeout(()=>{if(t=='nb_archive'){zInval();if(adminOn){if(atab=='zahlungen')zLoad(false);else if(atab=='auswertung'&&canRebuild())render()}return}refresh()},250)}

 if(DB.OUT.length&&!DB.busy&&DB.state!='offline')pump();
 const age=Date.now()-DB.lastFull;if(DB.state=='offline'&&age>6000){pump();refresh()}else if((!RT.ok&&age>5000)||age>60000)refresh()},1000);

function book(cid,did){const c=S.customers.find(x=>x.id==cid),d=S.drinks.find(x=>x.id==did);const pp=pr(d,c),label=`${d.name} ${d.amount} ${d.unit}`;
 toast('✔ '+d.name+' gebucht');c.entries.push({id:uid(),ts:Date.now(),cashier:cname(),did,label,price:pp,qty:1});c.paid=false;svcAdd(cid,label,1);save();render()}
function chg(cid,eid,n){const c=S.customers.find(x=>x.id==cid),e=c.entries.find(x=>x.id==eid);
 if(n<=0&&!canStorno(e))return toast(stornoMsg(),'#c0392b',3500);
 const del=()=>{c.entries=c.entries.filter(x=>x!=e);svcAdd(cid,e.label,-e.qty);save();render()};
 if(n==0)return ask('Buchung „'+e.label+'“ entfernen?',del,'Entfernen','r');
 if(e.qty+n<1)return ask('Posten „'+e.label+'“ wirklich entfernen?',del,'Entfernen','r');
 e.qty+=n;svcAdd(cid,e.label,n);save();render()}
function paid(cid){const c=S.customers.find(x=>x.id==cid);if(!c.entries.length){toast('Keine Buchungen zum Abschließen','#d9822b');return}
 const o=document.createElement('div');o.className='ov';o.style.zIndex=30;o.style.alignItems='center';
 o.innerHTML=`<div class="box" style="max-width:680px;text-align:center"><p style="font-size:26px;line-height:1.35;margin:12px 0 8px">Rechnung über <b>${eur(sum(c))}</b> als bezahlt abschließen?</p><p class="mut" style="font-size:18px;margin:0 0 20px">Die Buchungen von #${c.no} werden gelöscht, der Kunde bleibt bestehen. Die Zahlung bleibt im Admin-Archiv.</p><div style="display:flex;flex-wrap:wrap;gap:12px"><button class="g" data-m="Bar" style="flex:1;min-height:88px;font-size:24px">💶 Bar</button><button class="g" data-m="Karte" style="flex:1;min-height:88px;font-size:24px">💳 Karte</button><button class="g" data-m="Überweisung" style="flex:1;min-height:88px;font-size:24px">🏦 Überweisung</button></div><div class="row" style="margin-top:14px"><button id="pno" style="min-height:72px;font-size:22px">Abbrechen</button></div></div>`;
 document.body.appendChild(o);o.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{o.remove();doPaid(cid,b.dataset.m)});o.querySelector('#pno').onclick=()=>o.remove()}
async function doPaid(cid,m){const c=S.customers.find(x=>x.id==cid);if(!c)return;
 try{await dbFlush();const a=await auRpc('nb_pay',{p_customer:cid,p_method:m,p_cashier:cname(),p_archive:uid()});
  delete SVC[cid];await refresh(true);if(adminOn)admLoad(true);cur=null;render();toast('✔ Bezahlt – #'+a.no,null,1800);
  const o={no:a.no,name:a.name,cashier:a.cashier,entries:a.entries,method:a.method,ts:msOf(a.paid_at)},am=S.bon.auto;
  if(am=='1')printOut(o);
  else if(am!='2')ask('✔ Bezahlt per '+m+' – #'+a.no+'\n'+eur(a.entries.reduce((s,e)=>s+e.price*e.qty,0))+'\n\nQuittung drucken?',()=>printOut(o),'🖨 Bon drucken','g',null,'Ohne Bon')}
 catch(e){toast(e.message=='keine_buchungen'?'Keine Buchungen zum Abschließen':'Bezahlen nicht möglich: '+auNet(e),'#c0392b',4500);refresh(true)}}
function aktiv(id){const c=S.customers.find(x=>x.id==id);const off=c.active===false;c.active=off;if(off){c.created=Date.now();c.lastBooked=0}cur=null;save();render()}

/* ===== Abrechnung, QR, Export ===== */
function billText(c){return `NAVIBAR #${c.no} ${c.first} ${c.last} (${c.role})\n`+c.entries.map(e=>`${e.ts?fmt(e.ts)+' ':''}${e.qty}x ${e.label} ${eur(e.price*e.qty)}`).join('\n')+`\nSUMME ${eur(sum(c))}`}
function showQR(cid){const c=S.customers.find(x=>x.id==cid),t=billText(c),lines=t.split('\n'),parts=[''];
 lines.forEach(l=>{if(new TextEncoder().encode(parts[parts.length-1]+l).length>380)parts.push('');parts[parts.length-1]+=l+'\n'});
 const o=document.createElement('div');o.className='ov';o.style.zIndex=20;
 o.innerHTML=`<div class="box"><h2 style="margin-top:0">Abrechnung #${c.no}</h2>${parts.length>1?`<p class="mut">Die Abrechnung ist lang und auf ${parts.length} QR-Codes verteilt – bitte alle scannen.</p>`:'<p class="mut">Mit dem Handy scannen, der Text erscheint direkt.</p>'}<div id="qrs" class="row" style="justify-content:center"></div><pre>${esc(t)}</pre><div class="row"><button class="g" onclick="pdfBill('${c.id}')">PDF erstellen</button><button onclick="printBon('${c.id}')">🖨 Bon drucken</button><button class="o" onclick="mailBill('${c.id}')">E-Mail senden</button><button onclick="dl('abrechnung-${c.no}.txt',\`${t.replace(/`/g,'')}\`,'text/plain')">Als Textdatei</button><button class="b" id="qx">Schließen</button></div></div>`;
 document.body.appendChild(o);$('qx').onclick=()=>o.remove();
 parts.forEach((p,i)=>{try{const k=QR.draw((parts.length>1?`(${i+1}/${parts.length})\n`:'')+p.trim());$('qrs').appendChild(k)}catch(e){$('qrs').append('QR zu groß – bitte Textdatei nutzen.')}})}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;a.click()}
async function exportJ(){await admLoad(true);let ar=[];try{ar=(await admFetchAll('nb_archive','paid_at.desc')).map(a=>({id:a.id,no:a.no,name:a.name,role:a.role,cashier:a.cashier,method:a.method,paidAt:msOf(a.paid_at),entries:a.entries||[]}))}catch(e){alert('Zahlungen konnten nicht geladen werden: '+auNet(e));return}dl('navibar-notfall-export-'+today()+'.json',JSON.stringify({exportiert:new Date().toISOString(),customers:S.customers,drinks:S.drinks,cats:S.cats,vouchers:S.vouchers,cashiers:S.cashiers,mailTpl:S.mailTpl,bon:S.bon,archive:ar,dellog:S.dellog,usedNos:S.usedNos},null,1),'application/json');toast('Notfall-Export gespeichert',null,2500)}

/* ===== PDF (eigener Mini-Generator, offline) & E-Mail ===== */
function pdfBlob(lines){const per=46,pg=[];for(let i=0;i<lines.length;i+=per)pg.push(lines.slice(i,i+per));
 const en=s=>s.replace(/\u20ac/g,'\x80').replace(/[^\x00-\xff]/g,'?').replace(/[\\()]/g,'\\$&');
 let out='%PDF-1.4\n';const off=[];const add=(id,b)=>{off[id]=out.length;out+=id+' 0 obj\n'+b+'\nendobj\n'};
 add(1,'<</Type/Catalog/Pages 2 0 R>>');add(2,`<</Type/Pages/Kids[${pg.map((_,i)=>(4+2*i)+' 0 R').join(' ')}]/Count ${pg.length}>>`);
 add(3,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>');
 pg.forEach((p,i)=>{const s='BT /F1 12 Tf 50 790 Td 17 TL\n'+p.map(l=>'('+en(l)+') Tj T*').join('\n')+'\nET';
  add(4+2*i,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R>>>>/Contents ${5+2*i} 0 R>>`);add(5+2*i,`<</Length ${s.length}>>\nstream\n${s}\nendstream`)});
 const x=out.length,N=4+pg.length*2;out+=`xref\n0 ${N}\n0000000000 65535 f \n`+off.slice(1).map(f=>String(f).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${N}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
 return new Blob([Uint8Array.from(out,ch=>ch.charCodeAt(0))],{type:'application/pdf'})}
function pdfBill(cid){const c=S.customers.find(x=>x.id==cid);
 const a=document.createElement('a');a.href=URL.createObjectURL(pdfBlob(['Navibar - Abrechnung',today(),'',...billText(c).split('\n')]));a.download=`abrechnung-${c.no}-${today()}.pdf`;a.click()}

/* ===== E-Mail an Kunden (Vorlage mit Platzhaltern) ===== */
const fillTpl=(s,c)=>s.replace(/\{(Name|Nummer|Datum|Summe|Posten)\}/g,(_,k)=>({Name:(c.first+' '+c.last).trim(),Nummer:c.no,Datum:new Date().toLocaleDateString('de-DE'),Summe:eur(sum(c)),Posten:c.entries.map(e=>`${e.ts?fmt(e.ts)+' ':''}${e.qty}x ${e.label} ${eur(e.price*e.qty)}`).join('\n')})[k]);
function mailPay(cid){const c=S.customers.find(x=>x.id==cid);
 if(!c.mail){alert('Für diesen Kunden ist keine E-Mail-Adresse hinterlegt. Bitte unter „Ändern“ eintragen.');return}
 location.href='mailto:'+c.mail.trim()+'?subject='+encodeURIComponent(fillTpl(S.mailTpl.subj,c))+'&body='+encodeURIComponent(fillTpl(S.mailTpl.body,c))}
const textToHtml=t=>'<p>'+esc(t||'').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';
const htmlToText=s=>s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|li|h\d|tr)>/gi,'\n\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\n{3,}/g,'\n\n').trim();
const tplHtml=()=>S.mailTpl.html||textToHtml(S.mailTpl.body);
function formMailTpl(){const t=S.mailTpl,ex=(c,a)=>`onpointerdown="event.preventDefault();document.execCommand('${c}',false,${a?`'${a}'`:'null'})"`;
 modal('E-Mail-Vorlage',`<label>Betreff<input name="s" value="${esc(t.subj)}"></label>
 <div class="mtb"><button type="button" ${ex('bold')}><b>F</b></button><button type="button" ${ex('italic')}><i>K</i></button><button type="button" ${ex('underline')}><u>U</u></button><button type="button" ${ex('justifyLeft')}>⬅</button><button type="button" ${ex('justifyCenter')}>↔</button><button type="button" ${ex('insertUnorderedList')}>• Liste</button><button type="button" ${ex('fontSize','2')}>A−</button><button type="button" ${ex('fontSize','4')}>A</button><button type="button" ${ex('fontSize','6')}>A+</button>${['#0b2a4a','#1b5f8c','#c0392b','#238a76','#000000'].map(col=>`<button type="button" style="background:${col};min-width:50px" ${ex('foreColor',col)}></button>`).join('')}<button type="button" onclick="mailImg()">🖼 Bild</button></div>
 <div id="med" contenteditable="true" style="min-height:240px;max-height:40vh;overflow:auto;border:2px solid var(--line);border-radius:10px;padding:12px;background:#fff;font-size:18px">${tplHtml()}</div>
 <div class="mtb"><span class="mut">Platzhalter:</span>${['Name','Nummer','Datum','Summe','Posten'].map(k=>`<button type="button" onpointerdown="event.preventDefault();document.execCommand('insertText',false,'{${k}}')">{${k}}</button>`).join('')}</div>`,o=>{
 const hh=o.querySelector('#med').innerHTML;S.mailTpl={subj:o.querySelector('[name=s]').value,html:hh,body:htmlToText(hh)};save();render()})}
function mailImg(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,560/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 const u=c.toDataURL(/png|gif|svg/.test(f.type)?'image/png':'image/jpeg',.85);$('med').insertAdjacentHTML('beforeend','<p style="text-align:center"><img src="'+u+'"></p>')};im.src=r.result};r.readAsDataURL(f)};i.click()}
const postenHtml=c=>`<table style="border-collapse:collapse;width:100%">${c.entries.map(e=>`<tr><td style="padding:3px 8px;border-bottom:1px solid #ddd">${e.qty}× ${esc(e.label)}${e.ts?` <small style="color:#777">(${fmt(e.ts)})</small>`:''}</td><td style="padding:3px 8px;border-bottom:1px solid #ddd;text-align:right">${eur(e.price*e.qty)}</td></tr>`).join('')}</table>`;
const fillHtml=(s,c)=>s.replace(/\{(Name|Nummer|Datum|Summe|Posten)\}/g,(_,k)=>k=='Posten'?postenHtml(c):esc(String({Name:(c.first+' '+c.last).trim(),Nummer:c.no,Datum:new Date().toLocaleDateString('de-DE'),Summe:eur(sum(c))}[k])));
const b64=s=>btoa(unescape(encodeURIComponent(s))),wrap76=s=>s.replace(/(.{76})/g,'$1\r\n');
function buildEml(c){const subj=fillTpl(S.mailTpl.subj,c),parts=[];let n=0;
 let html=fillHtml(tplHtml(),c).replace(/src="data:(image\/[a-z+.-]+);base64,([^"]+)"/g,(m,t,d)=>{const id='img'+(++n)+'@navibar';parts.push({id,t,d});return 'src="cid:'+id+'"'});
 const B='=_navibar_'+Date.now();
 let e='X-Unsent: 1\r\nTo: '+(c.mail||'')+'\r\nSubject: =?UTF-8?B?'+b64(subj)+'?=\r\nMIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="'+B+'"; type="text/html"\r\n\r\n';
 e+='--'+B+'\r\nContent-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap76(b64('<html><body style="font-family:Arial,sans-serif;font-size:15px">'+html+'</body></html>'))+'\r\n';
 parts.forEach(p=>e+='--'+B+'\r\nContent-Type: '+p.t+'\r\nContent-Transfer-Encoding: base64\r\nContent-ID: <'+p.id+'>\r\nContent-Disposition: inline\r\n\r\n'+wrap76(p.d)+'\r\n');
 return e+'--'+B+'--\r\n'}
function mailEml(cid){const c=S.customers.find(x=>x.id==cid);dl('Bezahl-E-Mail-'+c.no+'.eml',buildEml(c),'message/rfc822');toast('E-Mail-Datei gespeichert – öffnen, dann öffnet sich der Entwurf',null,3500)}
function mailChoose(cid){const o=document.createElement('div');o.className='ov';o.style.zIndex=30;o.style.alignItems='center';
 o.innerHTML=`<div class="box" style="max-width:640px;text-align:center"><p style="font-size:26px;margin:12px 0 20px">Bezahl-E-Mail senden</p><div style="display:flex;flex-direction:column;gap:14px"><button class="g" id="m1" style="min-height:90px;font-size:22px">Schön formatiert<br><small>E-Mail-Datei (.eml) öffnen</small></button><button class="b" id="m2" style="min-height:90px;font-size:22px">Einfacher Text<br><small>Mailprogramm direkt öffnen</small></button><button id="m3" style="min-height:72px;font-size:22px">Abbrechen</button></div></div>`;

/* ===== Automatische Deaktivierung: 2 Monate ohne Buchung (Kunden mit offenen Posten bleiben aktiv) ===== */
function autoDeact(){const lim=new Date();lim.setMonth(lim.getMonth()-2);let n=0;
 S.customers.forEach(c=>{if(c.active===false||c.entries.length)return;if(Math.max(c.created||0,c.lastBooked||0)<lim.getTime()){c.active=false;n++}});
 if(n){save();render();toast(n+' Kunde(n) wegen 2 Monaten ohne Buchung deaktiviert','#d6453d',4000)}}

/* ===== Bildschirmtastatur: öffnet sich bei jedem Eingabefeld, System-Tastatur bleibt aus ===== */
const KB={t:null,shift:false},kbEl=document.createElement('div');kbEl.id='kb';document.body.appendChild(kbEl);
const INP='input:not([type=file]):not([type=color]),textarea,[contenteditable=true]';
const kbMode=()=>{try{return localStorage.getItem('navibar-kb')||'auto'}catch(e){return'auto'}};
const useOsk=()=>{const m=kbMode();return m=='on'||(m=='auto'&&!matchMedia('(max-width:760px)').matches)};
function fixIn(r){const osk=useOsk();r.querySelectorAll(INP).forEach(i=>{if(i.dataset.im===undefined){const m=i.getAttribute('inputmode');i.dataset.im=m&&m!='none'?m:'';if(i.dataset.im)i.dataset.kb='num'}
 i.setAttribute('inputmode',osk?'none':i.dataset.im);if(!osk&&i.tagName=='INPUT'&&i.dataset.kb!='num'&&i.type!='password'&&i.id!='sq'&&i.id!='dq'&&i.name!='m'&&!i.dataset.nocap)i.setAttribute('autocapitalize','words')})}
function setKbMode(m){try{localStorage.setItem('navibar-kb',m)}catch(e){}hideKb();fixIn(document);toast('Tastatur-Einstellung gespeichert',null,1500)}
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;const t=e.target;if(!t||!t.matches||!t.matches('input'))return;if(t.dataset.submit=='login'){e.preventDefault();lgSubmit();return}if(t.dataset.submit&&$('mok')){e.preventDefault();$('mok').click()}else if(t.id=='nn'){e.preventDefault();t.blur();openNo()}});
new MutationObserver(()=>fixIn(document)).observe(document.body,{childList:true,subtree:true});fixIn(document);
const eligible=t=>t.dataset.kb!='num'&&t.id!='sq'&&t.id!='dq'&&t.name!='m'&&t.type!='password'&&!t.dataset.nocap;
function showKb(){const t=KB.t,num=t.dataset.kb=='num',was=kbEl.style.display=='block';
 const rows=num?['789','456','123',',0⌫']:['1234567890ß','qwertzuiopü','asdfghjklöä','⇧yxcvbnm⌫'];

function importAsk(d,src){let R;try{R=oldToRows(d)}catch(e){alert('Die Daten konnten nicht gelesen werden: '+e.message);return}

async function importRun(R){const done={},tot=IMPORDER.reduce((s,[k])=>s+R[k].length,0);let sent=0,warn=[];
 const bar=document.createElement('div');bar.className='ov';bar.style.zIndex=45;bar.style.alignItems='center';bar.innerHTML='<div class="box" style="max-width:520px;text-align:center"><h2 style="margin-top:0">Daten werden übernommen …</h2><p id="ipr" style="font-size:20px">Starte …</p><p class="mut">Bitte nicht schließen.</p></div>';document.body.appendChild(bar);
 try{for(const[k,name]of IMPORDER){const rows=R[k],size=k=='archive'?60:k=='entries'?400:300;done[k]=0;
   for(let i=0;i<rows.length;i+=size){const chunk=rows.slice(i,i+size);bar.querySelector('#ipr').textContent=name+' … '+Math.min(sent+chunk.length,tot)+' von '+tot;
    done[k]+=await auRpc('nb_import',{p_table:k,p_rows:chunk});sent+=chunk.length}
   if(!rows.length&&k=='counter')continue;
   if(k=='customers'&&done[k]<rows.length)warn.push((rows.length-done[k])+' Kunde(n) nicht neu angelegt (Nummer oder ID schon vorhanden)')}
  bar.remove();zInval();await refresh(true);await admLoad(true);render();
  alert('Fertig.\n\n'+['customers','entries','drinks','archive'].map(k=>IMPORDER.find(x=>x[0]==k)[1]+': '+done[k]+' neu').join('\n')+(warn.length?'\n\nHinweis:\n'+warn.join('\n'):''))}
 catch(e){bar.remove();alert('Die Übernahme wurde unterbrochen: '+({nur_admin:'Die Admin-Anmeldung ist abgelaufen. Bitte neu anmelden und den Vorgang wiederholen.'}[e.message]||auNet(e))+'\n\nDas Bereits-Übernommene bleibt, der Vorgang darf wiederholt werden.')}}
function importFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.customers)||!Array.isArray(d.drinks))throw 0;importAsk(d,'der Datei „'+f.name+'“')}catch(e){alert('Die Datei ist kein Navibar-Backup.')}};r.readAsText(f)}
function importBox(){const d=oldFromBrowser();return `<h3>Alte Daten übernehmen</h3><p class="mut">Einmalig: Kunden, Buchungen, Getränke und Zahlungen aus der bisherigen Kasse nach Supabase holen. Vorhandenes wird nicht überschrieben.</p><div class="row">${d?`<button class="o" onclick="importAsk(oldFromBrowser(),'diesem Browser')">Aus diesem Browser (${d.customers.length} Kunden, ${(d.archive||[]).length} Zahlungen)</button>`:''}<button class="b" onclick="$('impf').click()">Aus Backup-Datei (.json)</button></div><input type="file" id="impf" accept=".json" style="display:none" onchange="importFile(this.files[0]);this.value=''">`}

function ausFrom(per){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),f={today:t0,week:t0-((n.getDay()+6)%7)*864e5,month:new Date(n.getFullYear(),n.getMonth(),1).getTime(),year:new Date(n.getFullYear(),0,1).getTime(),all:0}[per];return f?new Date(f).toISOString():null}
function ausReq(group,per){const k=ausMode+'|'+group+'|'+per,c=AUSC[k];
 if(!c||(Date.now()-c.t>30000&&!c.busy)){const e=AUSC[k]={t:c?c.t:0,r:c?c.r:null,busy:true};
  auRpc('nb_stats',{p_mode:ausMode,p_from:group=='month'?null:ausFrom(per),p_to:null,p_group:group}).then(r=>{AUSC[k]={t:Date.now(),r,busy:false};if(adminOn&&atab=='auswertung'&&canRebuild())render()})

function ausTable(r,lab){if(!r)return '<p class="mut">Lade …</p>';const rows=r.rows;if(!rows.length)return '<p class="mut">Keine Daten im gewählten Zeitraum.</p>';const mx=Math.max(1,...rows.map(x=>Number(x.sum)));
 return `<table><tr><th>${lab[0]}</th><th class="n">Menge</th><th class="n">Umsatz</th></tr>${rows.map(x=>`<tr><td>${esc(lab[1](x.k))}<div class="bar" style="width:${Math.max(2,Math.round(Math.max(0,Number(x.sum))/mx*100))}%"></div></td><td class="n">${x.qty}</td><td class="n">${eur(Number(x.sum))}</td></tr>`).join('')}<tr><th>Gesamt</th><th class="n">${r.total.qty}</th><th class="n">${eur(Number(r.total.sum))}</th></tr></table>`}
function vAus(){
 const head=`<div class="row noprint"><button class="${ausMode=='gebucht'?'on':''}" onclick="ausMode='gebucht';render()">Gebucht (nach Buchungsdatum)</button><button class="${ausMode=='bezahlt'?'on':''}" onclick="ausMode='bezahlt';render()">Bezahlt (nach Zahldatum)</button></div>
 <div class="row noprint">${[['monat','Monatsumsatz'],['getraenke','Getränke'],['kassierer','Kassierer'],['typ','Ausbilder / Teilnehmer']].map(([k,t])=>`<button class="${ausView==k?'on':''}" onclick="ausView='${k}';render()">${t}</button>`).join('')}</div>`;
 const note=`<p class="mut">${ausMode=='gebucht'?'Umsatz = alle Buchungen nach Buchungsdatum (auch noch offene), Gutscheine abgezogen.':'Umsatz = nur bezahlte Rechnungen nach Zahldatum, Gutscheine abgezogen.'} Gelöschte Zahlungen zählen nicht mit.</p>`;
 if(ausView!='monat'){const g={getraenke:'drink',kassierer:'cashier',typ:'role'}[ausView],r=ausReq(g,ausPer);
  const lab={getraenke:['Getränk',x=>x],kassierer:['Kassierer',x=>x],typ:['Gruppe',x=>x=='A'?'Ausbilder':'Teilnehmer']}[ausView];
  return head+`<div class="row noprint">${[['today','Heute'],['week','Woche'],['month','Monat'],['year','Jahr'],['all','Alle']].map(([k,t])=>`<button class="${ausPer==k?'on':''}" onclick="ausPer='${k}';render()">${t}</button>`).join('')}</div>`+ausTable(r,lab)+note}
 const r=ausReq('month','all'),by={};((r&&r.rows)||[]).forEach(x=>{const[y,m]=x.k.split('-').map(Number);(by[y]=by[y]||Array(12).fill(0))[m-1]+=Number(x.sum)});
 const Y=new Date().getFullYear(),years=[...new Set([Y,Y-1,...Object.keys(by).map(Number)])].sort((a,b)=>b-a);
 if(!ausY)ausY=[Y,Y-1];const sel=years.filter(y=>ausY.includes(y)).sort((a,b)=>a-b),col=y=>PAL[(Y-y+PAL.length*10)%PAL.length],val=(y,m)=>((by[y]||[])[m]||0)/100;
 const all=sel.flatMap(y=>MON.map((_,m)=>val(y,m))),mx=Math.max(1,...all),mn=Math.min(0,...all),raw=(mx-mn)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,5,10].map(m=>m*mag).find(s=>s>=raw);
 const top=Math.ceil(mx/step)*step,bot=Math.floor(mn/step)*step,L=70,T=30,PW=915,PH=290,yy=v=>T+(top-v)/(top-bot)*PH,gw=PW/12,bw=Math.min(36,(gw-10)/sel.length);
 let g='';for(let t=bot;t<=top+1e-9;t+=step)g+=`<line x1="${L}" x2="${L+PW}" y1="${yy(t)}" y2="${yy(t)}" stroke="#e3eaf0"/><text x="${L-8}" y="${yy(t)+4}" text-anchor="end" font-size="12" fill="#6b7f90">${t.toLocaleString('de-DE')} €</text>`;
 MON.forEach((n,m)=>{g+=`<text x="${L+m*gw+gw/2}" y="${T+PH+22}" text-anchor="middle" font-size="13" fill="#16324a">${n}</text>`;
  sel.forEach((y,k)=>{const v=val(y,m),x=L+m*gw+(gw-bw*sel.length)/2+k*bw,y0=yy(0),y1=yy(v);
   g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw-2}" height="${Math.max(1,Math.abs(y1-y0))}" fill="${col(y)}" rx="3"/>`;
   if(v)g+=`<text transform="rotate(-90 ${x+bw/2} ${Math.min(y0,y1)-5})" x="${x+bw/2}" y="${Math.min(y0,y1)-5}" font-size="11" fill="#16324a">${Math.round(v).toLocaleString('de-DE')} €</text>`})});
 g+=`<line x1="${L}" x2="${L+PW}" y1="${yy(0)}" y2="${yy(0)}" stroke="#16324a"/>`;
 return head+`<div class="row noprint"><span class="mut" style="flex:0 0 auto">Jahre:</span>${years.map(y=>`<button style="${ausY.includes(y)?`background:${col(y)};border-color:${col(y)};color:#fff`:`border-color:${col(y)}`}" onclick="toggY(${y})">${y}</button>`).join('')}</div>
 ${r?'':'<p class="mut">Lade …</p>'}<div class="card"><svg viewBox="0 0 1000 360" style="width:100%;height:auto">${g}</svg></div>
 <p>${sel.slice().reverse().map(y=>`<b style="color:${col(y)}">${y}</b>: ${eur((by[y]||[]).reduce((a,b)=>a+b,0))}`).join(' &nbsp;·&nbsp; ')}</p>`+note}

/* ===== Excel: Vorlage, Export, Import (eigener xlsx-Schreiber/-Leser, komplett offline) ===== */
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipStore(files){const te=new TextEncoder(),parts=[],cd=[],u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];let off=0;

 img.onload=()=>{let W=Math.min(384,img.width),H=Math.round(img.height*W/img.width);if(H>260){W=Math.round(W*260/H);H=260}
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
  const d=x.getImageData(0,0,W,H),p=d.data;for(let i=0;i<p.length;i+=4){const g=.3*p[i]+.59*p[i+1]+.11*p[i+2],b=g<160?0:255;p[i]=p[i+1]=p[i+2]=b;p[i+3]=255}x.putImageData(d,0,0);URL.revokeObjectURL(u);
  const r=c.toDataURL('image/png');if(r.length>250000)return alert('Das Logo ist zu groß. Bitte ein einfacheres Bild verwenden.');cb(r)};

 if(I.f<0&&I.l<0){alert('Spalten nicht gefunden. Erwartet: Vorname, Nachname, Spitzname, E-Mail, Typ.');return}
 const g=(r,j)=>j>=0&&r[j]!==undefined?String(r[j]).trim():'';
 const list=rows.slice(1).map(r=>({first:g(r,I.f),last:g(r,I.l),nick:g(r,I.n),mail:g(r,I.m),role:(()=>{const t=g(r,I.r).toUpperCase();return /^A/.test(t)?'A':/^T/.test(t)||!t?'T':t})()})).filter(x=>x.first||x.last||x.nick||x.mail);
 if(!list.length){alert('Die Datei enthält keine Kunden.');return}
 try{const pv=await auRpc('nb_import_customers',{p_rows:list,p_dry:true});
  const er=pv.errors.slice(0,6).map(e=>`Zeile ${e.row+1}: ${e.msg}`).join('\n');
  const msg=`Kunden-Import:\n${pv.created.length} neu anlegen\n${pv.existing.length} schon vorhanden (übersprungen)\n${pv.errors.length} fehlerhaft${er?'\n'+er:''}`;
  if(!pv.created.length){alert(msg);return}
  ask(msg+'\n\nJetzt anlegen?',async()=>{try{const r=await auRpc('nb_import_customers',{p_rows:list,p_dry:false});await refresh(true);if(adminOn)admLoad(true);render();toast('✔ '+r.created.length+' Kunden angelegt',null,3000)}catch(e){alert(kxMsg(e))}},'Anlegen')}
 catch(e){alert(kxMsg(e))}}
const kxMsg=e=>({keine_berechtigung:'Dafür fehlt die Berechtigung (Admin-Anmeldung oder Freigabe unter „Konten & Rechte“).',zu_viele_zeilen:'Maximal 2000 Zeilen pro Datei.'}[e.message]||auNet(e));
function kxBox(){if(!kxAllowed())return '';return `<h3>Kunden aus Excel importieren</h3><p class="mut">Mehrere Kunden auf einmal anlegen. Die Kundennummern vergibt die Kasse automatisch, vorhandene Namen werden übersprungen. Vorher gibt es eine Vorschau.</p><div class="row"><button onclick="kxTemplate()">⬇ Excel-Vorlage</button><button class="o" onclick="$('kxf').click()">⬆ Excel importieren</button></div><input type="file" id="kxf" accept=".xlsx,.csv" style="display:none" onchange="kxFile(this.files[0]);this.value=''">`}
/* ===== Hinweis „Neue Version verfügbar“ ===== */
let verShown=false;
async function verCheck(){if(verShown||!AUTH.s||navigator.onLine===false)return;
 try{const r=await fetch('index.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text(),m=t.match(/APP_VERSION=\x27([0-9.]+)\x27/);
  if(m&&m[1]!==APP_VERSION){verShown=true;const b=document.createElement('div');b.className='newv';b.innerHTML='<span>Neue Version verfügbar</span><button class="g" id="nvb">Neu laden</button><button id="nvx">später</button>';document.body.appendChild(b);
   $('nvx').onclick=()=>{b.remove();setTimeout(()=>{verShown=false},3600000)};
   $('nvb').onclick=async()=>{$('nvb').disabled=true;try{await dbFlush()}catch(e){alert('Es warten noch nicht gesendete Änderungen. Bitte erst warten, bis „Live in Supabase gesichert“ angezeigt wird.');$('nvb').disabled=false;return}
    try{const rg=await navigator.serviceWorker.getRegistration();if(rg)await rg.update()}catch(e){}location.reload()}}}catch(e){}}
setTimeout(verCheck,20000);setInterval(verCheck,600000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(verCheck,1500)});
/* ===== Zentraler Druckplatz: alle Geräte schicken Bons an die Druckstation (PC mit Bon-Drucker) ===== */
const DEVK='navibar-dev';let DEV={station:false,mode:'station'};
try{Object.assign(DEV,JSON.parse(localStorage.getItem(DEVK)||'{}'))}catch(e){}
const devSave=()=>{try{localStorage.setItem(DEVK,JSON.stringify(DEV))}catch(e){}};
const ST={busy:false,last:0,pinged:0,printed:0,err:'',seen:{t:0,on:false,name:''}};
async function stationOn(){if(Date.now()-ST.seen.t<10000)return ST.seen.on;
 try{const r=await auRpc('nb_print_status');ST.seen={t:Date.now(),on:!!r&&r.secs!=null&&r.secs<75,name:(r&&r.name)||''}}catch(e){ST.seen={t:Date.now(),on:false,name:''}}return ST.seen.on}
async function printOut(o){if(DEV.station||DEV.mode=='local')return bonPrint(o);
 const send=async()=>{try{await auRpc('nb_print_enqueue',{p_kind:o.svc?'svc':'bon',p_payload:o});toast('🖨 An Druckstation gesendet',null,1800)}
  catch(e){ask('An die Druckstation senden ging nicht ('+auNet(e)+').\n\nHier auf diesem Gerät drucken?',()=>bonPrint(o),'Hier drucken')}};
 if(await stationOn())return send();
 ask('Die Druckstation ist gerade nicht erreichbar.\n\nTrotzdem einreihen (druckt, sobald sie wieder da ist) oder hier drucken?',send,'Einreihen','g',()=>bonPrint(o),'Hier drucken')}
const printWait=o=>new Promise(res=>{let d=false;const f=()=>{if(!d){d=true;res()}};setTimeout(f,30000);try{bonPrint(o,f)}catch(e){f()}});
async function stPoll(){if(ST.busy||!DEV.station||!AUTH.s)return;ST.busy=true;ST.last=Date.now();
 try{const l=await auRpc('nb_print_pending');ST.err='';
  for(const j of (l||[])){const got=await auRpc('nb_print_claim',{p_id:j.id});if(!got)continue;await printWait(j.payload);ST.printed++}}
 catch(e){if(e.message!='abgemeldet')ST.err=auNet(e)}
 ST.busy=false;stUi()}
function stLoop(){if(!DEV.station||!AUTH.s||!DB.started||AUTH.rec)return;const n=Date.now();
 if(n-ST.pinged>20000){ST.pinged=n;auRpc('nb_print_ping',{p_name:'Druckstation'}).catch(()=>{})}
 if(!ST.busy&&n-ST.last>3000)stPoll()}
setInterval(stLoop,1000);
function stUi(){const e=$('stinfo');if(e)e.innerHTML=stInfoHtml()}
const stInfoHtml=()=>DEV.station?`<b style="color:${ST.err?'var(--red)':'var(--green)'}">${ST.err?'Fehler: '+esc(ST.err):'aktiv – wartet auf Druckaufträge'}</b><br><small class="mut">Heute gedruckt (seit Start dieser Seite): ${ST.printed}</small>`:'';
function stSet(on){DEV.station=on;devSave();ST.pinged=0;ST.last=0;if(on){stLoop();toast('🖨 Dieses Gerät ist jetzt die Druckstation',null,2500)}dbUi();if($('stbox'))$('stbox').innerHTML=stBox()}
function stMode(m){DEV.mode=m;devSave();if($('stbox'))$('stbox').innerHTML=stBox()}
function stBox(){return `<h3>🖨 Druckplatz</h3>
 <p class="mut">Die <b>Druckstation</b> ist der PC mit dem Bon-Drucker. Alle anderen Geräte (PC, Handy) schicken Quittungen und Service-Bons dorthin. Die Seite muss dort nur geöffnet und angemeldet sein – ein Kassierer muss nicht gewählt sein.</p>
 <div class="row"><button class="${DEV.station?'g':''}" onclick="stSet(${!DEV.station})">${DEV.station?'✔ Dieses Gerät ist die Druckstation (ausschalten)':'Dieses Gerät zur Druckstation machen'}</button></div>
 <div id="stinfo">${stInfoHtml()}</div>
 ${DEV.station?`<p class="mut">Für Druck ohne Dialog Chrome so starten: <code>chrome.exe --kiosk-printing</code> und den Bon-Drucker als Standarddrucker einstellen. Diese Seite offen lassen.</p><div class="row"><button onclick="stRecent()">Letzte Aufträge anzeigen</button></div><div id="strec"></div>`
 :`<label>Drucken von diesem Gerät<select onchange="stMode(this.value)"><option value="station" ${DEV.mode!='local'?'selected':''}>an die Druckstation schicken</option><option value="local" ${DEV.mode=='local'?'selected':''}>hier auf diesem Gerät drucken</option></select></label><div class="row"><button onclick="stCheck()">Druckstation prüfen</button></div><div id="strec"></div>`}`}
async function stCheck(){ST.seen.t=0;const on=await stationOn();$('strec').innerHTML=on?'<b style="color:var(--green)">Druckstation ist erreichbar.</b>':'<b style="color:var(--red)">Keine Druckstation erreichbar</b> (läuft die Kasse dort, ist sie angemeldet und als Druckstation eingestellt?)'}
async function stRecent(){try{const l=await auRpc('nb_print_recent',{p_limit:12});window.__stl=l;
 $('strec').innerHTML=l.map((j,i)=>`<div class="card zrow"><small class="mut">${dtf(Date.parse(j.created_at))} · ${esc(j.email||'')} · ${j.kind=='svc'?'Service-Bon':'Bon'} · ${j.done_at?'gedruckt':'<b style="color:var(--orange)">wartet</b>'}</small><div>#${j.payload.no} ${esc(j.payload.name||'')}</div><div class="row" style="margin:4px 0 0"><button onclick="bonPrint(window.__stl[${i}].payload)">Nochmal drucken</button></div></div>`).join('')||'<p class="mut">Noch keine Aufträge.</p>'}catch(e){$('strec').innerHTML='<p class="mut">'+esc(auNet(e))+'</p>'}}
function stDialog(){const o=document.createElement('div');o.className='ov';o.style.zIndex=30;o.innerHTML=`<div class="box" style="max-width:640px"><div id="stbox">${stBox()}</div><div class="row"><button id="stx">Schließen</button></div></div>`;document.body.appendChild(o);o.querySelector('#stx').onclick=()=>o.remove()}
const APP_VERSION='2026.11.03';
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();setInterval(autoDeact,3600000);
</script></body></html>
