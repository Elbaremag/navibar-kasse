<header><h1>⚓ Navibar</h1><nav id="nav"></nav><span id="gh" style="margin-left:auto"></span><span id="bk"></span><span id="tm"></span><span id="who" style="display:flex;gap:8px;align-items:center"></span></header>
<main id="main"></main><div id="ov"></div><div id="bonp"></div>
<script>
/* ===== QR-Encoder (Byte-Modus, ECC L, Version 1-20, Maske 0) – komplett offline ===== */
const QR=(()=>{
const EC=[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28],NB=[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8];
const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r};
const cap=v=>Math.floor(raw(v)/8)-EC[v-1]*NB[v-1];
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>7)*0x11d);z^=((y>>i)&1)*x}return z};
function rs(d,n){let g=[1];let r=1;for(let i=0;i<n;i++){const h=g.concat(0);for(let j=0;j<g.length;j++){h[j]=mul(g[j],r);if(j+1<h.length)h[j+1]^=g[j]}
 // multiply g by (x - r)
 g=[...Array(g.length+1)].map((_,k)=>(k<g.length?g[k]:0)^(k>0?mul(g[k-1],r):0));r=mul(r,2)}
 g=g.slice(1);// leading coeff 1 removed
 const res=new Array(n).fill(0);
 for(const b of d){const f=b^res.shift();res.push(0);g.forEach((c,i)=>res[i]^=mul(c,f))}return res}
function make(text){
 const by=[...new TextEncoder().encode(text)];let v=1;while(v<=20&&cap(v)*8<4+(v<10?8:16)+8*by.length)v++;
 if(v>20)throw 0;
 let bits=[];const put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>i)&1)};
 put(4,4);put(by.length,v<10?8:16);by.forEach(b=>put(b,8));
 const cw=cap(v)*8;put(0,Math.min(4,cw-bits.length));while(bits.length%8)bits.push(0);
 const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
 for(let p=0xec;data.length<cap(v);p^=0xfd)data.push(p);
 const nb=NB[v-1],ec=EC[v-1],rc=Math.floor(raw(v)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb);
 const blocks=[];for(let i=0,k=0;i<nb;i++){const dl=sl-ec+(i<ns?0:1);const d=data.slice(k,k+dl);k+=dl;const e=rs(d,ec);if(i<ns)d.push(0);blocks.push(d.concat(e))}
 const out=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-ec||j>=ns)out.push(b[i])});
 const S=v*4+17,M=[...Array(S)].map(()=>Array(S).fill(false)),F=[...Array(S)].map(()=>Array(S).fill(false));
 const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
 for(let i=0;i<S;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
 const fin=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy,d=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&y>=0&&x<S&&y<S)set(x,y,d!=2&&d!=4)}};
 fin(3,3);fin(S-4,3);fin(3,S-4);
 if(v>1){const n=Math.floor(v/7)+2,st=Math.ceil((v*4+4)/(n*2-2))*2,p=[6];for(let q=S-7;p.length<n;q-=st)p.splice(1,0,q);
  p.forEach((a,i)=>p.forEach((b,j)=>{if((i==0&&j==0)||(i==0&&j==n-1)||(i==n-1&&j==0))return;
   for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}))}
 // Formatbits (ECC L, Maske 0)
 let d=8,r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>9)*0x537);const fb=((d<<10)|r)^0x5412,g=i=>((fb>>i)&1)==1;
 for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
 for(let i=0;i<8;i++)set(S-1-i,8,g(i));for(let i=8;i<15;i++)set(8,S-15+i,g(i));set(8,S-8,true);
 if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>11)*0x1f25);const vb=(v<<12)|r;for(let i=0;i<18;i++){const b=((vb>>i)&1)==1,a=S-11+i%3,c=Math.floor(i/3);set(a,c,b);set(c,a,b)}}
 let i=0;for(let right=S-1;right>=1;right-=2){if(right==6)right=5;for(let vert=0;vert<S;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)==0,y=up?S-1-vert:vert;
  if(!F[y][x]&&i<out.length*8){M[y][x]=((out[i>>3]>>(7-(i&7)))&1)==1;i++}}}
 for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(!F[y][x]&&(x+y)%2==0)M[y][x]=!M[y][x];
 return M}
function draw(text){const M=make(text),c=document.createElement('canvas'),k=Math.max(3,Math.floor(380/(M.length+8))),n=(M.length+8)*k;c.width=c.height=n;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,n,n);x.fillStyle='#000';M.forEach((r,y)=>r.forEach((d,i)=>d&&x.fillRect((i+4)*k,(y+4)*k,k,k)));return c}
return{draw}})();

/* ===== Daten & Speichern (automatisch in localStorage) ===== */
const KEY='navibar-kasse-v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{drinks:[],customers:[],nextNo:1,lastBackup:''};
const norm=()=>{S.vouchers=S.vouchers||[];S.usedNos=S.usedNos||[];S.customers.forEach(c=>{if(!S.usedNos.includes(c.no))S.usedNos.push(c.no);if(!c.created)c.created=Date.now()});S.mailTpl=S.mailTpl||{subj:'Deine Abrechnung – Navibar',body:'Hallo {Name},\n\nhier ist deine Abrechnung vom {Datum}:\n\n{Posten}\n\nSumme: {Summe}\n\nViele Grüße\nNavibar'};S.cashiers=S.cashiers||[];S.archive=S.archive||[];S.dellog=S.dellog||[];S.bon=Object.assign({head:'NAVIBAR',foot:'Danke und bis bald!',cashier:'1',time:'1',prices:'1',name:'1',auto:'0',width:'80'},S.bon||{});S.archive.forEach(a=>{if(!a.id)a.id=Math.random().toString(36).slice(2,9)});S.pin=S.pin||'1234';if(!S.cats){S.cats=[];S.drinks.forEach(d=>{if(d.type){let k=S.cats.find(c=>c.name==d.type);if(!k){k={id:Math.random().toString(36).slice(2,9),name:d.type};S.cats.push(k)}d.cat=k.id}})}};norm();
const nextNo=()=>Math.max(S.nextNo,...S.usedNos.map(n=>n+1));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Speichern im Browser fehlgeschlagen – bitte Backup exportieren!')}lbQueue();ghQueue()};
const uid=()=>Math.random().toString(36).slice(2,9);
const eur=c=>(c/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const cents=s=>Math.round(parseFloat(String(s).replace(',','.'))*100);
const pr=(d,c)=>c.role=='A'&&d.priceA!=null?d.priceA:d.price;
const sum=c=>c.entries.reduce((a,e)=>a+e.price*e.qty,0);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let tab='kunden',q='',cur=null;
const $=id=>document.getElementById(id);

/* ===== Ansichten ===== */
function renderMain(){
 $('nav').innerHTML=[['kunden','Kunden'],['inaktiv','Deaktiviert'],['uebersicht','Übersicht'],['backup','Backup']].map(([k,t])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${t}</button>`).join('');
 const m=$('main');
 const ban=S.lastBackup!=today()&&LB.state!='on'&&!GH.cfg?`<div class="banner noprint"><span>Heute wurde noch kein Backup erstellt.</span><button class="o" onclick="exportJ()">Backup jetzt speichern</button></div>`:'';
 m.innerHTML=ban+({kunden:()=>vKunden(),inaktiv:vInakt,getraenke:vGetr,uebersicht:vUeb,auswertung:vAus,backup:vBackup})[tab]();
 if(cur)detail();else $('ov').innerHTML=''}
let sortBy='no';
const fmt=ts=>new Date(ts).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function vKunden(ina){
 const t=q.toLowerCase(),act=x=>x.active!==false;
 const l=S.customers.filter(c=>(ina?!act(c):act(c))&&(c.first+' '+c.last+' '+(c.nick||'')+' '+c.no).toLowerCase().includes(t));
 l.sort((x,y)=>sortBy=='no'?x.no-y.no:(x[sortBy]||'').localeCompare(y[sortBy]||'','de')||x.no-y.no);
 return `<div class="row"><input id="sq" placeholder="Suche: Nummer, Vorname, Nachname, Spitzname" value="${esc(q)}" oninput="q=this.value;const p=this.selectionStart;render();const i=$('sq');i.focus();i.setSelectionRange(p,p)">${ina?'':'<button class="b" onclick="formKunde()">+ Kunde</button>'}</div>
 ${ina?'':'<div class="row"><input id="nn" inputmode="numeric" placeholder="Kundennummer eingeben"><button class="b" onclick="openNo()">Öffnen</button></div>'}
 <div class="row noprint"><span class="mut" style="flex:0 0 auto">Sortieren:</span>${[['no','Nummer'],['first','Vorname'],['last','Nachname']].map(([k,n])=>`<button class="${sortBy==k?'on':''}" onclick="sortBy='${k}';render()">${n}</button>`).join('')}</div>
 <div class="grid">${l.map(c=>`<button class="card ${c.entries.length?'open':'paid'}" onclick="cur='${c.id}';render()"><b>#${c.no} ${esc(c.first)} ${esc(c.last)}</b> <span class="tag ${c.role}">${c.role}</span>${c.nick?`<br><small>„${esc(c.nick)}“</small>`:''}<br><span class="total" style="font-size:22px">${eur(sum(c))}</span>${badge(c)}<br><small>${c.entries.length?'offen':'keine Buchungen'}</small></button>`).join('')||`<p class="mut">${ina?'Keine deaktivierten Kunden.':'Keine Kunden gefunden. Mit „+ Kunde“ anlegen.'}</p>`}</div>`}
const vInakt=()=>vKunden(true);
function vGetr(){return `<div class="row"><button class="b" onclick="formGetr()">+ Getränk</button></div><div class="row"><button onclick="xlTemplate()">⬇ Excel-Vorlage</button><button onclick="xlExport()">⬇ Getränke als Excel</button><button class="o" onclick="$('xli').click()">⬆ Excel importieren</button></div><input type="file" id="xli" accept=".xlsx,.csv" style="display:none" onchange="xlImport(this.files[0]);this.value=''">
 <table><tr><th>Getränk</th><th>Kategorie</th><th>Menge</th><th class="n">Teilnehmer</th><th class="n">Ausbilder</th><th></th></tr>${S.drinks.slice().sort((a,b)=>a.name.localeCompare(b.name,'de')).map(d=>`<tr><td>${esc(d.name)}${d.priceSince?`<br><small class="mut">neuer Preis seit ${new Date(d.priceSince).toLocaleDateString('de-DE')}</small>`:''}</td><td>${esc(catName(d))}</td><td>${d.amount} ${d.unit}</td><td class="n">${eur(d.price)}</td><td class="n">${eur(d.priceA!=null?d.priceA:d.price)}</td><td class="n"><button onclick="formGetr('${d.id}')">Ändern</button> <button class="r" onclick="delGetr('${d.id}')">✕</button></td></tr>`).join('')}</table>
 <h3>Getränkebons</h3><div class="row"><button class="o" onclick="formBonStamm()">+ Getränkebon</button></div><table>${S.vouchers.map(b=>`<tr><td>🎟 ${esc(b.name)}</td><td class="n">${eur(b.value)}</td><td class="n">${b.qty>0?b.qty+' Stück':'fragt nach'}</td><td class="n"><button onclick="formBonStamm('${b.id}')">Ändern</button> <button class="r" onclick="delBon('${b.id}')">✕</button></td></tr>`).join('')}</table>
 <h3>E-Mail-Vorlage</h3><p class="mut">Betreff: ${esc(S.mailTpl.subj)}</p><div class="row"><button onclick="formMailTpl()">E-Mail-Vorlage bearbeiten</button></div>`}
function vUeb(){const tot=S.customers.reduce((a,c)=>a+sum(c),0),op=S.customers.filter(c=>!c.paid).reduce((a,c)=>a+sum(c),0);
 return `<table><tr><th>Nr.</th><th>Name</th><th>Typ</th><th class="n">Summe</th><th>Status</th><th class="noprint"></th></tr>${S.customers.filter(c=>sum(c)!==0).map(c=>`<tr><td>${c.no}</td><td>${esc(c.first)} ${esc(c.last)}${c.nick?` „${esc(c.nick)}“`:''}${c.active===false?' <small class="mut">(deaktiviert)</small>':''}</td><td>${c.role}</td><td class="n">${eur(sum(c))}</td><td>${badge(c)||'–'}</td><td class="noprint"><button onclick="cur='${c.id}';render()">Öffnen</button></td></tr>`).join('')}</table>
 ${S.customers.some(c=>sum(c)!==0)?'':'<p class="mut">Keine offenen Kunden.</p>'}<p class="total">Gesamt offen ${eur(tot)}</p><div class="row noprint"><button class="b" onclick="print()">Übersicht drucken</button><button onclick="dl('uebersicht-'+today()+'.txt',S.customers.filter(c=>sum(c)!==0).map(billText).join('\n\n----------\n'),'text/plain')">Alle Abrechnungen als Textdatei</button></div>`}
function vBackup(){return `<p class="mut">Programmversion ${APP_VERSION} · Adresse: ${esc(location.href.split('#')[0])}<br>Die Daten liegen im Browser dieser Adresse. Mit Cloud-Speicher (GitHub oder Supabase) werden sie zusätzlich dort gesichert.</p>${devBox()}<p>Alle Daten werden automatisch im Browser gespeichert. Das Backup sichert zusätzlich alles als Datei auf dem Laptop.</p><div class="row"><button class="g" onclick="exportJ()">Backup exportieren</button><button class="o" onclick="$('imp').click()">Backup importieren</button></div><input type="file" id="imp" accept=".json" style="display:none" onchange="importJ(this.files[0])"><h3>Live-Sicherung (bei jeder Änderung)</h3><p>Status: ${LB.state=='on'?`<b style="color:var(--green)">aktiv</b>, Ordner „${esc(LB.h.name)}“`:'<b style="color:var(--red)">nicht aktiv</b>'}</p><p class="mut">Jede Änderung wird sofort in eine Datei im gewählten Ordner geschrieben (navibar-live.json) plus eine Tagesdatei. Die letzten 7 Tage bleiben erhalten. Nur in Chrome oder Edge.</p><div class="row"><button class="b" onclick="lbSetup()">Sicherungsordner wählen</button><button onclick="lbRestore()">Aus Live-Sicherung wiederherstellen</button></div><p class="mut">Letztes manuelles Backup: ${S.lastBackup||'noch keines'}</p>`}

/* ===== Kunde: Detail & Buchen ===== */
function detail(){const c=S.customers.find(x=>x.id==cur);if(!c){cur=null;$('ov').innerHTML='';return}
 const hh=document.querySelector('header').offsetHeight;document.documentElement.style.setProperty('--hh',hh+'px');
 $('ov').innerHTML=`<div class="ov" style="top:${hh}px"><div class="box det ${bonOpen?'bonopen':''}">
 <div class="dleftcol"><div class="dtop"><button onclick="cur=null;dq='';dcat='all';render()">←<span class="lb"> Zurück</span></button><button class="stor" onclick="undoLast('${c.id}')">↩ <span class="lb">Letzte stornieren</span><span class="sb">Storno</span></button><span class="sp"></span><button class="o" onclick="formEinzel('${c.id}')">+ <span class="lb">Einzelposten</span><span class="sb">Posten</span></button><button class="g" onclick="formGut('${c.id}')">± <span class="lb">Gegenbuchung</span><span class="sb">Gegen</span></button><button onclick="formKunde('${c.id}')">✎<span class="lb"> Ändern</span></button></div>
 <div class="dmain"><div class="cats"><div class="catlist"><button class="cat ${dcat=='all'?'on':''}" onclick="setCat('all')">Alle</button>${S.vouchers.length?`<button class="cat ${dcat=='bons'?'on':''}" style="--cc:#7a8a99" onclick="setCat('bons')">🎟 Bons</button>`:''}${catsSorted().map(k=>`<button class="cat ${dcat==k.id?'on':''}" style="--cc:${ccol(k.id)}" onclick="setCat('${k.id}')">${esc(k.name)}</button>`).join('')}</div><button class="cat misc ${dcat=='_misc'?'on':''}" style="--cc:#9aa0a6" onclick="setCat('_misc')">Sonstiges</button></div>
 <div class="dleft"><input id="dq" placeholder="Getränk suchen" value="${esc(dq)}" oninput="dq=this.value;$('tiles').innerHTML=tilesHtml(S.customers.find(x=>x.id==cur))"><div id="tiles" class="tiles">${tilesHtml(c)}</div></div></div></div>
 <div class="dright"><div class="dhead"><span>#${c.no} ${esc(c.first)} ${esc(c.last)} <span class="tag ${c.role}">${c.role}</span>${c.nick?` <small class="mut">„${esc(c.nick)}“</small>`:''}</span><button class="bontoggle" onclick="toggleBon()">Bon (${c.entries.length}) ${bonOpen?'▾':'▴'}</button></div><div class="escroll" style="flex:1 1 auto">${c.entries.map(e=>`<div class="pos"><div><b>${e.qty}× ${esc(e.label)}</b><small>${e.ts?fmt(e.ts):''}${e.cashier?' · '+esc(e.cashier):''}</small></div><span class="${e.price<0?'neg':''}">${eur(e.price*e.qty)}</span><div class="pb"><button onclick="chg('${c.id}','${e.id}',-1)">−</button><button onclick="chg('${c.id}','${e.id}',1)">+</button></div></div>`).join('')||'<p class="mut">Noch keine Buchungen.</p>'}</div>
  <div class="dsum"><div class="srow"><span>Summe</span><span>${eur(sum(c))}${badge(c)}</span></div><button class="kass" onclick="paid('${c.id}')">✔ Bezahlt</button>
  <div class="row sm"><button onclick="mailChoose('${c.id}')">Bezahl-E-Mail</button><button onclick="showQR('${c.id}')">Abrechnung / QR / PDF</button><button onclick="printBon('${c.id}')">🖨 Bon</button></div>
  <div class="row sm"><button class="o" onclick="aktiv('${c.id}')">${c.active===false?'Aktivieren':'Deaktivieren'}</button><button class="r" onclick="delKunde('${c.id}')">Löschen</button></div></div></div></div></div>`}
let bonOpen=false;function toggleBon(){bonOpen=!bonOpen;detail()}
function book(cid,did){const c=S.customers.find(x=>x.id==cid),d=S.drinks.find(x=>x.id==did);const pp=pr(d,c);
 toast('✔ '+d.name+' gebucht');c.entries.push({id:uid(),ts:Date.now(),cashier:cname(),did,label:`${d.name} ${d.amount} ${d.unit}`,price:pp,qty:1});c.paid=false;save();render()}
function chg(cid,eid,n){const c=S.customers.find(x=>x.id==cid),e=c.entries.find(x=>x.id==eid);
 const del=()=>{c.entries=c.entries.filter(x=>x!=e);save();render()};
 if(n==0)return ask('Buchung „'+e.label+'“ entfernen?',del,'Entfernen','r');
 if(e.qty+n<1)return ask('Posten „'+e.label+'“ wirklich entfernen?',del,'Entfernen','r');
 e.qty+=n;save();render()}
function paid(cid){const c=S.customers.find(x=>x.id==cid);if(!c.entries.length){toast('Keine Buchungen zum Abschließen','#d9822b');return}
 const o=document.createElement('div');o.className='ov';o.style.zIndex=30;o.style.alignItems='center';
 o.innerHTML=`<div class="box" style="max-width:680px;text-align:center"><p style="font-size:26px;line-height:1.35;margin:12px 0 8px">Rechnung über <b>${eur(sum(c))}</b> als bezahlt abschließen?</p><p class="mut" style="font-size:18px;margin:0 0 20px">Die Buchungen von #${c.no} werden gelöscht, der Kunde bleibt bestehen. Die Zahlung bleibt im Admin-Archiv.</p><div style="display:flex;flex-wrap:wrap;gap:12px"><button class="g" data-m="Bar" style="flex:1;min-height:88px;font-size:24px">💶 Bar</button><button class="g" data-m="Karte" style="flex:1;min-height:88px;font-size:24px">💳 Karte</button><button class="g" data-m="Überweisung" style="flex:1;min-height:88px;font-size:24px">🏦 Überweisung</button></div><div class="row" style="margin-top:14px"><button id="pno" style="min-height:72px;font-size:22px">Abbrechen</button></div></div>`;
 document.body.appendChild(o);o.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{o.remove();doPaid(cid,b.dataset.m)});o.querySelector('#pno').onclick=()=>o.remove()}
function doPaid(cid,m){const c=S.customers.find(x=>x.id==cid);
 const a={id:uid(),no:c.no,name:(c.first+' '+c.last).trim(),role:c.role,cashier:cname(),paidAt:Date.now(),method:m,entries:c.entries.map(e=>({...e}))};S.archive.push(a);
 c.lastBooked=Math.max(c.lastBooked||0,...c.entries.map(e=>e.ts||0));c.entries=[];c.paid=false;save();render();if(S.bon.auto=='1')bonPrint({no:a.no,name:a.name,cashier:a.cashier,entries:a.entries,method:m,ts:a.paidAt})}
function aktiv(id){const c=S.customers.find(x=>x.id==id);const off=c.active===false;c.active=off;if(off){c.created=Date.now();c.lastBooked=0}cur=null;save();render()}
function delKunde(id){ask('Kunde mit allen Buchungen löschen?',()=>{S.customers=S.customers.filter(c=>c.id!=id);cur=null;save();render()},'Löschen','r')}

/* ===== Formulare (Modal) ===== */
function modal(title,html,ok,lbl){const o=document.createElement('div');o.className='ov';o.style.zIndex=20;
 o.innerHTML=`<div class="box"><h2 style="margin-top:0">${title}</h2>${html}<div class="row"><button class="g" id="mok">${lbl||'Speichern'}</button><button id="mno">Abbrechen</button></div></div>`;document.body.appendChild(o);
 $('mno').onclick=()=>o.remove();$('mok').onclick=()=>{if(ok(o)!==false)o.remove()};fixIn(o);const f=o.querySelector('input');f&&f.focus()}
const v=(o,n)=>o.querySelector('[name='+n+']').value.trim();
function formKunde(id){const c=S.customers.find(x=>x.id==id)||{first:'',last:'',role:'T'};
 modal(id?'Kunde ändern':'Neuer Kunde',`<label>Kundennummer (frei wählbar)<input name="no" inputmode="numeric" value="${id?c.no:nextNo()}"></label><div class="row"><input name="f" placeholder="Vorname" value="${esc(c.first)}"><input name="l" placeholder="Nachname" value="${esc(c.last)}"></div><input name="s" placeholder="Spitzname (optional)" value="${esc(c.nick||'')}"><input name="m" placeholder="E-Mail (optional)" value="${esc(c.mail||'')}"><select name="r"><option value="T" ${c.role=='T'?'selected':''}>T – Teilnehmer</option><option value="A" ${c.role=='A'?'selected':''}>A – Ausbilder</option></select>`,o=>{
 if(!v(o,'f')&&!v(o,'l'))return false;
 const no=parseInt(v(o,'no'));if(!no||no<1){alert('Bitte eine gültige Nummer eingeben.');return false}
 if(S.usedNos.includes(no)&&!(id&&c.no==no)){alert('Nummer '+no+' wurde schon vergeben (auch gelöschte Nummern werden nicht erneut vergeben). Der Admin kann gelöschte Nummern im Admin-Bereich freigeben.');return false}
 if(id){Object.assign(c,{no,nick:v(o,'s'),mail:v(o,'m'),first:v(o,'f'),last:v(o,'l'),role:v(o,'r')})}else{const n={id:uid(),no,nick:v(o,'s'),mail:v(o,'m'),created:Date.now(),active:true,first:v(o,'f'),last:v(o,'l'),role:v(o,'r'),paid:false,entries:[]};S.customers.push(n);cur=n.id}
 if(!S.usedNos.includes(no))S.usedNos.push(no);S.nextNo=Math.max(S.nextNo,no+1);save();render()})}
function formGetr(id){const d=S.drinks.find(x=>x.id==id)||{name:'',type:'',amount:'',unit:'ml',price:''};
 modal(id?'Getränk ändern':'Neues Getränk',`<input name="n" placeholder="Name (z. B. Pils)" value="${esc(d.name)}"><div class="row"><select name="c"><option value="">– keine Kategorie –</option>${catsSorted().map(k=>`<option value="${k.id}" ${d.cat==k.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select></div><div class="row"><input name="a" inputmode="decimal" placeholder="Menge" value="${d.amount}"><select name="u"><option ${d.unit=='ml'?'selected':''}>ml</option><option ${d.unit=='Stück'?'selected':''}>Stück</option></select></div><div class="row"><label style="flex:1">Preis Teilnehmer (€)<input name="p" inputmode="decimal" value="${d.price===''?'':(d.price/100).toFixed(2).replace('.',',')}"></label><label style="flex:1">Preis Ausbilder (€)<input name="pa" inputmode="decimal" value="${d.price===''?'':((d.priceA!=null?d.priceA:d.price)/100).toFixed(2).replace('.',',')}"></label></div>`,o=>{
 const p=cents(v(o,'p')),pa=v(o,'pa')===''?p:cents(v(o,'pa'));if(!v(o,'n')||isNaN(p)||isNaN(pa))return false;
 const x={name:v(o,'n'),type:(S.cats.find(k=>k.id==v(o,'c'))||{name:''}).name,cat:v(o,'c'),amount:v(o,'a'),unit:v(o,'u'),price:p,priceA:pa};
 if(id){if(d.price!=p||(d.priceA!=null?d.priceA:d.price)!=pa)x.priceSince=Date.now();Object.assign(d,x)}else S.drinks.push({id:uid(),...x});save();render()})}
function delGetr(id){ask('Getränk löschen?\nBestehende Buchungen bleiben erhalten.',()=>{S.drinks=S.drinks.filter(d=>d.id!=id);save();render()},'Löschen','r')}
function formGut(cid){modal('Manuelle Gegenbuchung',`<input name="t" placeholder="Text (z. B. Getränkegutschein)" value="Getränkegutschein"><input name="p" inputmode="decimal" placeholder="Betrag in € (z. B. 2,00)">`,o=>{
 let p=cents(v(o,'p'));if(isNaN(p)||!p)return false;p=-Math.abs(p);const c=S.customers.find(x=>x.id==cid);
 c.entries.push({id:uid(),ts:Date.now(),cashier:cname(),did:null,label:v(o,'t')||'Gutschrift',price:p,qty:1});c.paid=false;save();render()})}

/* ===== Abrechnung, QR, Export ===== */
function billText(c){return `NAVIBAR #${c.no} ${c.first} ${c.last} (${c.role})\n`+c.entries.map(e=>`${e.ts?fmt(e.ts)+' ':''}${e.qty}x ${e.label} ${eur(e.price*e.qty)}`).join('\n')+`\nSUMME ${eur(sum(c))}`}
function showQR(cid){const c=S.customers.find(x=>x.id==cid),t=billText(c),lines=t.split('\n'),parts=[''];
 lines.forEach(l=>{if(new TextEncoder().encode(parts[parts.length-1]+l).length>380)parts.push('');parts[parts.length-1]+=l+'\n'});
 const o=document.createElement('div');o.className='ov';o.style.zIndex=20;
 o.innerHTML=`<div class="box"><h2 style="margin-top:0">Abrechnung #${c.no}</h2>${parts.length>1?`<p class="mut">Die Abrechnung ist lang und auf ${parts.length} QR-Codes verteilt – bitte alle scannen.</p>`:'<p class="mut">Mit dem Handy scannen, der Text erscheint direkt.</p>'}<div id="qrs" class="row" style="justify-content:center"></div><pre>${esc(t)}</pre><div class="row"><button class="g" onclick="pdfBill('${c.id}')">PDF erstellen</button><button onclick="printBon('${c.id}')">🖨 Bon drucken</button><button class="o" onclick="mailBill('${c.id}')">E-Mail senden</button><button onclick="dl('abrechnung-${c.no}.txt',\`${t.replace(/`/g,'')}\`,'text/plain')">Als Textdatei</button><button class="b" id="qx">Schließen</button></div></div>`;
 document.body.appendChild(o);$('qx').onclick=()=>o.remove();
 parts.forEach((p,i)=>{try{const k=QR.draw((parts.length>1?`(${i+1}/${parts.length})\n`:'')+p.trim());$('qrs').appendChild(k)}catch(e){$('qrs').append('QR zu groß – bitte Textdatei nutzen.')}})}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;a.click()}
function exportJ(){S.lastBackup=today();save();dl('navibar-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json');render()}
function importJ(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
 if(!Array.isArray(d.drinks)||!Array.isArray(d.customers)||typeof d.nextNo!='number')throw 0;

/* ===== PDF (eigener Mini-Generator, offline) & E-Mail ===== */
function pdfBlob(lines){const per=46,pg=[];for(let i=0;i<lines.length;i+=per)pg.push(lines.slice(i,i+per));
 const en=s=>s.replace(/\u20ac/g,'\x80').replace(/[^\x00-\xff]/g,'?').replace(/[\\()]/g,'\\$&');
 let out='%PDF-1.4\n';const off=[];const add=(id,b)=>{off[id]=out.length;out+=id+' 0 obj\n'+b+'\nendobj\n'};
 add(1,'<</Type/Catalog/Pages 2 0 R>>');add(2,`<</Type/Pages/Kids[${pg.map((_,i)=>(4+2*i)+' 0 R').join(' ')}]/Count ${pg.length}>>`);
 add(3,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>');
 pg.forEach((p,i)=>{const s='BT /F1 12 Tf 50 790 Td 17 TL\n'+p.map(l=>'('+en(l)+') Tj T*').join('\n')+'\nET';
  add(4+2*i,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R>>>>/Contents ${5+2*i} 0 R>>`);add(5+2*i,`<</Length ${s.length}>>\nstream\n${s}\nendstream`)});
 const x=out.length,N=4+pg.length*2;out+=`xref\n0 ${N}\n0000000000 65535 f \n`+off.slice(1).map(f=>String(f).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${N}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
 return new Blob([Uint8Array.from(out,ch=>ch.charCodeAt(0))],{type:'application/pdf'})}

 <div id="med" contenteditable="true" style="min-height:240px;max-height:40vh;overflow:auto;border:2px solid var(--line);border-radius:10px;padding:12px;background:#fff;font-size:18px">${tplHtml()}</div>

function mailImg(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,560/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext('2d').drawImage(im,0,0,c.width,c.height);

const postenHtml=c=>`<table style="border-collapse:collapse;width:100%">${c.entries.map(e=>`<tr><td style="padding:3px 8px;border-bottom:1px solid #ddd">${e.qty}× ${esc(e.label)}${e.ts?` <small style="color:#777">(${fmt(e.ts)})</small>`:''}</td><td style="padding:3px 8px;border-bottom:1px solid #ddd;text-align:right">${eur(e.price*e.qty)}</td></tr>`).join('')}</table>`;
const fillHtml=(s,c)=>s.replace(/\{(Name|Nummer|Datum|Summe|Posten)\}/g,(_,k)=>k=='Posten'?postenHtml(c):esc(String({Name:(c.first+' '+c.last).trim(),Nummer:c.no,Datum:new Date().toLocaleDateString('de-DE'),Summe:eur(sum(c))}[k])));
const b64=s=>btoa(unescape(encodeURIComponent(s))),wrap76=s=>s.replace(/(.{76})/g,'$1\r\n');
function buildEml(c){const subj=fillTpl(S.mailTpl.subj,c),parts=[];let n=0;

 const B='=_navibar_'+Date.now();
 let e='X-Unsent: 1\r\nTo: '+(c.mail||'')+'\r\nSubject: =?UTF-8?B?'+b64(subj)+'?=\r\nMIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="'+B+'"; type="text/html"\r\n\r\n';
 e+='--'+B+'\r\nContent-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap76(b64('<html><body style="font-family:Arial,sans-serif;font-size:15px">'+html+'</body></html>'))+'\r\n';
 parts.forEach(p=>e+='--'+B+'\r\nContent-Type: '+p.t+'\r\nContent-Transfer-Encoding: base64\r\nContent-ID: <'+p.id+'>\r\nContent-Disposition: inline\r\n\r\n'+wrap76(p.d)+'\r\n');
 return e+'--'+B+'--\r\n'}

function autoDeact(){const lim=new Date();lim.setMonth(lim.getMonth()-2);let n=0;
 S.customers.forEach(c=>{if(c.active===false||c.entries.length)return;if(Math.max(c.created||0,c.lastBooked||0)<lim.getTime()){c.active=false;n++}});
 if(n){save();render();toast(n+' Kunde(n) wegen 2 Monaten ohne Buchung deaktiviert','#d6453d',4000)}}

/* ===== Bildschirmtastatur: öffnet sich bei jedem Eingabefeld, System-Tastatur bleibt aus ===== */
const KB={t:null,shift:false},kbEl=document.createElement('div');kbEl.id='kb';document.body.appendChild(kbEl);
const INP='input:not([type=file]):not([type=color]),textarea,[contenteditable=true]';
const kbMode=()=>{try{return localStorage.getItem('navibar-kb')||'auto'}catch(e){return'auto'}};
const useOsk=()=>{const m=kbMode();return m=='on'||(m=='auto'&&!matchMedia('(max-width:760px)').matches)};
function fixIn(r){const osk=useOsk();r.querySelectorAll(INP).forEach(i=>{if(i.dataset.im===undefined){const m=i.getAttribute('inputmode');i.dataset.im=m&&m!='none'?m:'';if(i.dataset.im)i.dataset.kb='num'}
 i.setAttribute('inputmode',osk?'none':i.dataset.im);if(!osk&&i.tagName=='INPUT'&&i.dataset.kb!='num'&&i.type!='password'&&i.id!='sq'&&i.id!='dq'&&i.name!='m'&&!i.dataset.nocap)i.setAttribute('autocapitalize','words')})}
function setKbMode(m){try{localStorage.setItem('navibar-kb',m)}catch(e){}hideKb();fixIn(document);toast('Tastatur-Einstellung gespeichert',null,1500)}
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;const t=e.target;if(!t||!t.matches||!t.matches('input'))return;if(t.dataset.submit&&$('mok')){e.preventDefault();$('mok').click()}else if(t.id=='nn'){e.preventDefault();t.blur();openNo()}});
new MutationObserver(()=>fixIn(document)).observe(document.body,{childList:true,subtree:true});fixIn(document);
const eligible=t=>t.dataset.kb!='num'&&t.id!='sq'&&t.id!='dq'&&t.name!='m'&&t.type!='password'&&!t.dataset.nocap;
function showKb(){const t=KB.t,num=t.dataset.kb=='num',was=kbEl.style.display=='block';
 const rows=num?['789','456','123',',0⌫']:['1234567890ß','qwertzuiopü','asdfghjklöä','⇧yxcvbnm⌫'];
 const key=(k,l)=>`<button data-k="${k}">${l||(KB.shift&&!num&&k.length==1?k.toUpperCase():k)}</button>`;
 kbEl.innerHTML=rows.map(r=>`<div class="kr">${[...r].map(k=>key(k)).join('')}</div>`).join('')+(num?'':`<div class="kr">${key('@')}${key('.')}${key('-')}${key('_')}${key(' ','Leertaste')}${key(',')}${(t.tagName=='TEXTAREA'||t.isContentEditable)?key('\n','↵'):''}</div>`)+`<div class="kr">${key('DONE','Fertig')}</div>`;
 kbEl.className=num?'num':'';kbEl.style.display='block';document.documentElement.style.setProperty('--kbh',kbEl.offsetHeight+'px');document.body.classList.add('kbopen');if(!was)setTimeout(()=>t.scrollIntoView({block:'center',behavior:'smooth'}),60)}
function hideKb(){kbEl.style.display='none';document.body.classList.remove('kbopen');KB.t=null}
document.addEventListener('focusin',e=>{const t=e.target;if(!t.matches||!t.matches(INP))return;fixIn(document);if(!useOsk())return;KB.t=t;const L=(t.value||'').length;[0,60].forEach(ms=>setTimeout(()=>{try{t.setSelectionRange(L,L)}catch(e){}},ms));
 KB.shift=(t.value!==undefined?t.value:t.textContent.trim())===''&&eligible(t);showKb()});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches(INP))hideKb()},200));
kbEl.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();kk(b.dataset.k)});
function kk(k){const t=KB.t;if(!t)return;
 if(k=='⇧'){KB.shift=!KB.shift;showKb();return}
 if(k=='DONE'){const id=t.id,sub=t.dataset.submit;t.blur();hideKb();if(id=='nn')openNo();if(sub&&$('mok'))$('mok').click();return}
 if(t.isContentEditable){if(k=='⌫')document.execCommand('delete');else if(k=='\n')document.execCommand('insertParagraph');else{document.execCommand('insertText',false,KB.shift&&k.length==1?k.toUpperCase():k);if(KB.shift){KB.shift=false;showKb()}}return}
 if(k=='⌫'){const s=t.selectionStart,e=t.selectionEnd;t.setRangeText('',s==e&&s>0?s-1:s,e,'end')}
 else{t.setRangeText(KB.shift&&k.length==1?k.toUpperCase():k,t.selectionStart,t.selectionEnd,'end');if(KB.shift){KB.shift=false;showKb()}}
 if(t.value===''&&eligible(t)&&!KB.shift){KB.shift=true;showKb()}t.dispatchEvent(new Event('input',{bubbles:true}))}

 o.innerHTML=`<div class="box" style="max-width:620px;text-align:center"><p style="font-size:26px;line-height:1.35;margin:12px 0 24px;white-space:pre-line">${esc(msg)}</p><div class="row"><button class="${cls||'g'}" id="yes" style="min-height:76px;font-size:24px">${lbl||'Ja'}</button><button id="no" style="min-height:76px;font-size:24px">Abbrechen</button></div></div>`;

/* ===== Auswertung: Monatsumsatz als Diagramm (Archiv + offene Buchungen, Gutscheine abgezogen) ===== */
let ausY=null;const PAL=['#1d6fd1','#f08a1c','#1f9d63','#9b59b6','#d6453d','#16a3b8'],MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function toggY(y){if(ausY.includes(y)){if(ausY.length>1)ausY=ausY.filter(x=>x!=y)}else ausY.push(y);render()}
function vAus(){const rows=[];if(ausMode=='bezahlt')S.archive.forEach(a=>a.entries.forEach(e=>rows.push({ts:a.paidAt,price:e.price,qty:e.qty})));else{S.archive.forEach(a=>a.entries.forEach(e=>rows.push(e)));S.customers.forEach(c=>c.entries.forEach(e=>rows.push(e)))}
 const by={};rows.forEach(e=>{if(!e.ts)return;const d=new Date(e.ts),y=d.getFullYear();(by[y]=by[y]||Array(12).fill(0))[d.getMonth()]+=e.price*e.qty});
 const Y=new Date().getFullYear(),years=[...new Set([Y,Y-1,...Object.keys(by).map(Number)])].sort((a,b)=>b-a);
 if(!ausY)ausY=[Y,Y-1];const sel=years.filter(y=>ausY.includes(y)).sort((a,b)=>a-b),col=y=>PAL[(Y-y+PAL.length*10)%PAL.length],val=(y,m)=>((by[y]||[])[m]||0)/100;
 const all=sel.flatMap(y=>MON.map((_,m)=>val(y,m))),mx=Math.max(1,...all),mn=Math.min(0,...all),raw=(mx-mn)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,5,10].map(m=>m*mag).find(s=>s>=raw);
 const top=Math.ceil(mx/step)*step,bot=Math.floor(mn/step)*step,L=70,T=30,PW=915,PH=290,yy=v=>T+(top-v)/(top-bot)*PH,gw=PW/12,bw=Math.min(36,(gw-10)/sel.length);
 let g='';for(let t=bot;t<=top+1e-9;t+=step)g+=`<line x1="${L}" x2="${L+PW}" y1="${yy(t)}" y2="${yy(t)}" stroke="#e3eaf0"/><text x="${L-8}" y="${yy(t)+4}" text-anchor="end" font-size="12" fill="#6b7f90">${t.toLocaleString('de-DE')} €</text>`;
 MON.forEach((n,m)=>{g+=`<text x="${L+m*gw+gw/2}" y="${T+PH+22}" text-anchor="middle" font-size="13" fill="#16324a">${n}</text>`;
  sel.forEach((y,k)=>{const v=val(y,m),x=L+m*gw+(gw-bw*sel.length)/2+k*bw,y0=yy(0),y1=yy(v);
   g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw-2}" height="${Math.max(1,Math.abs(y1-y0))}" fill="${col(y)}" rx="3"/>`;
   if(v)g+=`<text transform="rotate(-90 ${x+bw/2} ${Math.min(y0,y1)-5})" x="${x+bw/2}" y="${Math.min(y0,y1)-5}" font-size="11" fill="#16324a">${Math.round(v).toLocaleString('de-DE')} €</text>`})});
 g+=`<line x1="${L}" x2="${L+PW}" y1="${yy(0)}" y2="${yy(0)}" stroke="#16324a"/>`;
 return `<div class="row noprint"><button class="${ausMode=='gebucht'?'on':''}" onclick="ausMode='gebucht';render()">Gebucht (nach Buchungsdatum)</button><button class="${ausMode=='bezahlt'?'on':''}" onclick="ausMode='bezahlt';render()">Bezahlt (nach Zahldatum)</button></div>
 <div class="row noprint"><span class="mut" style="flex:0 0 auto">Jahre:</span>${years.map(y=>`<button style="${ausY.includes(y)?`background:${col(y)};border-color:${col(y)};color:#fff`:`border-color:${col(y)}`}" onclick="toggY(${y})">${y}</button>`).join('')}</div>
 <div class="card"><svg viewBox="0 0 1000 360" style="width:100%;height:auto">${g}</svg></div>
 <p>${sel.slice().reverse().map(y=>`<b style="color:${col(y)}">${y}</b>: ${eur((by[y]||[]).reduce((a,b)=>a+b,0))}`).join(' &nbsp;·&nbsp; ')}</p>
 <p class="mut">${ausMode=='gebucht'?'Umsatz = alle Buchungen nach Buchungsdatum (auch noch offene), Gutscheine abgezogen.':'Umsatz = nur bezahlte Rechnungen nach Zahldatum, Gutscheine abgezogen.'} Gelöschte Zahlungen zählen nicht mit. Rechnungen, die vor dem Archiv als bezahlt gelöscht wurden, fehlen.</p>`}

 const dr=dcat=='bons'?'':S.drinks.filter(d=>(dcat=='all'||d.cat==dcat)&&(d.name+' '+catName(d)).toLowerCase().includes(t)).sort(srt).map(d=>`<button class="tile" style="--tc:${ccol(d.cat)};color:${txtCol(ccol(d.cat))}" onclick="book('${c.id}','${d.id}')"><b>${esc(d.name)}</b><span>${d.amount} ${d.unit}</span><i>${eur(pr(d,c))}</i></button>`).join('');

function pickKatColor(id){const k=S.cats.find(x=>x.id==id),o=document.createElement('div');o.className='ov';o.style.zIndex=30;o.style.alignItems='center';

function adminStamm(){return `<h3>Kassierer</h3><div class="row"><button class="b" onclick="formKassierer()">+ Kassierer</button></div><table>${S.cashiers.map(k=>`<tr><td>${esc(k.name)}</td><td class="n"><button onclick="formKassierer('${k.id}')">Umbenennen</button> <button class="r" onclick="delKassierer('${k.id}')">✕</button></td></tr>`).join('')||'<tr><td class="mut">Noch keine Kassierer.</td></tr>'}</table>

 modal(id?'Kategorie umbenennen':'Neue Kategorie',`<input name="n" placeholder="Name (z. B. Bier)" value="${esc(k.name)}">`,o=>{const n=v(o,'n');if(!n)return false;

/* ===== Live-Sicherung: jede Änderung wird sofort in eine Datei auf dem PC geschrieben (Chrome/Edge) ===== */
const LB={h:null,state:'off',last:null,t:null,busy:false,again:false,rot:''};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('navibar-kasse-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async k=>{const d=await idb();return new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})};
const idbSet=async(k,v)=>{const d=await idb();return new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res()})};
function lbUi(){const b=$('bk');if(!b)return;
 const m={on:['#7fe0b0','● <span class="cl">Live-Sicherung '+(LB.last?LB.last.toLocaleTimeString('de-DE'):'aktiv')+'</span>'],ask:['#ffd27f','⚠ <span class="cl">Sicherung pausiert</span>'],off:['#ff8a80','⚠ <span class="cl">Keine Live-Sicherung</span>'],err:['#ff8a80','⚠ <span class="cl">Sicherung fehlgeschlagen</span>'],unsupported:null}[LB.state];if(!m){b.innerHTML='';return}
 b.innerHTML=`<button onclick="lbClick()" style="background:transparent;border:2px solid ${m[0]};color:${m[0]};min-height:46px;padding:4px 12px;font-size:15px" title="antippen">${m[1]}</button>`}
function lbClick(){if(LB.state=='ask')lbAsk();else if(LB.state=='on')toast('Live-Sicherung läuft. Ordner: '+LB.h.name,null,2500);else lbSetup()}
async function lbReadLive(){try{const f=await (await LB.h.getFileHandle('navibar-live.json')).getFile();const d=JSON.parse(await f.text());return Array.isArray(d.drinks)&&Array.isArray(d.customers)?d:null}catch(e){return null}}
const isEmptyS=()=>!S.customers.length&&!S.drinks.length&&!S.cashiers.length;
function lbOfferRestore(d){ask(`Im Sicherungsordner liegt eine Sicherung:\n${d.customers.length} Kunden, ${d.drinks.length} Getränke.\nJetzt wiederherstellen?`,()=>{S=d;norm();save();cur=null;render()},'Wiederherstellen')}
async function lbSetup(){if(!window.showDirectoryPicker){alert('Die Live-Sicherung funktioniert nur in Chrome oder Edge.');return}
 try{const h=await showDirectoryPicker({mode:'readwrite',id:'navibar-sicherung'});LB.h=h;await idbSet('dir',h);LB.state='on';
  const old=await lbReadLive();
  if(old&&(old.customers.length||old.drinks.length)){
   if(isEmptyS()){lbUi();render();lbOfferRestore(old);return}
   const g=await h.getFileHandle('navibar-vorher-'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'.json',{create:true});const w=await g.createWritable();await w.write(JSON.stringify(old));await w.close()}
  await lbWrite();toast('Live-Sicherung aktiv',null,2000)}
 catch(e){if(e.name!='AbortError'){LB.state='err';alert('Ordner konnte nicht gewählt werden: '+e.message)}}
 lbUi();render()}
async function lbInit(){try{if(!window.showDirectoryPicker){LB.state='unsupported';lbUi();return}
 const h=await idbGet('dir');if(!h){LB.state='off';lbUi();return}LB.h=h;
 LB.state=(await h.queryPermission({mode:'readwrite'}))=='granted'?'on':'ask'}catch(e){LB.state='off'}lbUi();render()}
async function lbAsk(){try{LB.state=(await LB.h.requestPermission({mode:'readwrite'}))=='granted'?'on':'ask';if(LB.state=='on'){const d=await lbReadLive();if(d&&isEmptyS()&&(d.customers.length||d.drinks.length))lbOfferRestore(d);else await lbWrite()}}catch(e){LB.state='err'}lbUi();render()}
async function lbRestore(){if(!LB.h){alert('Zuerst den Sicherungsordner wählen.');return}
 try{if((await LB.h.requestPermission({mode:'readwrite'}))!='granted')return}catch(e){return}
 const d=await lbReadLive();if(!d){alert('Keine gültige Live-Sicherung im Ordner gefunden.');return}lbOfferRestore(d)}
function lbQueue(){if(LB.state!='on')return;clearTimeout(LB.t);LB.t=setTimeout(lbWrite,250)}
async function lbWrite(){if(LB.state!='on'||!LB.h)return;if(LB.busy){LB.again=true;return}LB.busy=true;
 try{if(isEmptyS()){const o=await lbReadLive();if(o&&(o.customers.length||o.drinks.length)){LB.busy=false;return}}
  const data=JSON.stringify(S);
  for(const n of ['navibar-live.json','navibar-backup-'+today()+'.json']){const f=await LB.h.getFileHandle(n,{create:true});const w=await f.createWritable();await w.write(data);await w.close()}
  if(LB.rot!=today()){LB.rot=today();const names=[];for await(const [n] of LB.h.entries())if(/^navibar-backup-\d{4}-\d{2}-\d{2}\.json$/.test(n))names.push(n);names.sort().reverse();for(const n of names.slice(7))await LB.h.removeEntry(n)}
  LB.last=new Date()}
 catch(e){LB.state=e&&e.name=='NotAllowedError'?'ask':'err'}
 LB.busy=false;lbUi();if(LB.again){LB.again=false;lbWrite()}}

const ghDirty=()=>Object.entries(ghFiles()).some(([k,t])=>GH.st.hash[k]!==hsh(t));
function ghApply(name,d,merge){
 if(name=='stamm.json'){if(merge){['cats','drinks','vouchers','cashiers'].forEach(k=>S[k]=uni(S[k],d[k]));S.usedNos=[...new Set([...(S.usedNos||[]),...(d.usedNos||[])])];S.nextNo=Math.max(S.nextNo||1,d.nextNo||1)}
  else{['cats','drinks','vouchers','cashiers','usedNos'].forEach(k=>{if(d[k])S[k]=d[k]});['mailTpl','bon','pin','nextNo'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k]})}}
 else if(name=='kunden.json'){if(merge){const m=new Map((d.customers||[]).map(c=>[c.id,c]));S.customers.forEach(c=>{const r=m.get(c.id);if(r){c.entries=uni(c.entries,r.entries);m.delete(c.id)}});S.customers=[...S.customers,...m.values()]}else S.customers=d.customers||[]}
 else if(name=='protokoll.json'){S.dellog=merge?uni(S.dellog,d.dellog,x=>x.ts+'|'+x.no):(d.dellog||[])}
 else{const y=+name.match(/\d+/)[0],yr=a=>new Date(a.paidAt).getFullYear();S.archive=merge?uni(S.archive,d.archive):S.archive.filter(a=>yr(a)!=y).concat(d.archive||[])}}
async function ghList(){if(isSb())return sbList();const r=await ghApi('/contents/');if(r.status==404)return[];if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();return Array.isArray(j)?j.filter(x=>x.type=='file'&&GH_RE.test(x.name)):[]}
async function ghGet(name){if(isSb())return sbGet(name);const r=await ghApi('/contents/'+name,{raw:1});if(!r.ok)throw new Error('GitHub '+r.status);return r.text()}
async function ghPull(merge){const list=await ghList();let ch=false;
 for(const x of list){if(GH.st.sha[x.name]===x.sha)continue;
  const txt=await ghGet(x.name);let d;try{d=JSON.parse(txt)}catch(e){continue}if(!d)continue;
  ghApply(x.name,d,merge);GH.st.sha[x.name]=x.sha;ch=true;if(!merge)GH.st.hash[x.name]=hsh(ghFiles()[x.name]||'')}
 Object.keys(GH.st.sha).forEach(n=>{if(!list.some(x=>x.name==n))delete GH.st.sha[n]});
 ghSaveSt();if(ch){norm();save()}return ch}
async function ghPut(name,txt){if(isSb())return sbPut(name,txt);const body={message:'Navibar '+name+' '+new Date().toLocaleString('de-DE'),content:b64e(txt)};if(GH.st.sha[name])body.sha=GH.st.sha[name];
 const r=await ghApi('/contents/'+name,{method:'PUT',body:JSON.stringify(body)});
 if(r.status==409||r.status==422)return{conflict:true};if(!r.ok)throw new Error('GitHub '+r.status);
 const j=await r.json();GH.st.sha[name]=j.content.sha;GH.st.hash[name]=hsh(txt);ghSaveSt();return{ok:true}}
async function ghPush(){if(!GH.cfg)return;if(GH.busy){GH.again=true;return}GH.busy=true;GH.state='sync';ghUi();let conflict=false;
 try{for(const[name,txt]of Object.entries(ghFiles())){if(GH.st.hash[name]===hsh(txt))continue;
   let r=await ghPut(name,txt);
   if(r.conflict){conflict=true;await ghPull(true);r=await ghPut(name,ghFiles()[name]);if(r.conflict)throw new Error('Konflikt')}}
  GH.last=new Date();GH.state='ok';if(conflict)GH.needRender=true}
 catch(e){GH.state=navigator.onLine===false?'offline':'err';GH.err=e.message}
 GH.busy=false;ghUi();if(GH.again||GH.state!='ok'||conflict){GH.again=false;ghQueue(GH.state=='ok'?1500:15000)}}
function ghQueue(ms){if(!GH.cfg)return;clearTimeout(GH.t);GH.t=setTimeout(ghPush,ms||4000)}
const canRender=()=>!document.querySelector('body > .ov')&&kbEl.style.display!='block';
async function ghPoll(){if(!GH.cfg||GH.busy)return;if(GH.needRender&&canRender()){GH.needRender=false;render()}
 if(ghDirty()){ghQueue(500);return}
 try{const ch=await ghPull(false);GH.state='ok';GH.last=new Date();if(ch){if(canRender())render();else GH.needRender=true}}catch(e){GH.state=navigator.onLine===false?'offline':'err'}ghUi()}
async function ghStart(){try{const dirty=ghDirty();await ghPull(dirty);GH.state='ok';GH.last=new Date();if(dirty)ghQueue(800);render()}catch(e){GH.state=navigator.onLine===false?'offline':'err'}ghUi()}
function ghUi(){const b=$('gh');if(!b)return;const t=GH.cfg&&{ok:['#7fe0b0','☁ <span class="cl">'+ghName()+' '+(GH.last?GH.last.toLocaleTimeString('de-DE'):'verbunden')+'</span>'],sync:['#ffd27f','☁ <span class="cl">sendet …</span>'],offline:['#ff8a80','☁ <span class="cl">offline – wartet</span>'],err:['#ff8a80','☁ <span class="cl">Fehler – antippen</span>']}[GH.state];
 b.innerHTML=t?`<button onclick="ghClick()" style="background:transparent;border:2px solid ${t[0]};color:${t[0]};min-height:46px;padding:4px 12px;font-size:15px">${t[1]}</button>`:''}
function ghClick(){if(GH.state=='ok')toast(ghName()+': '+(isSb()?GH.cfg.url.replace('https://',''):GH.cfg.owner+'/'+GH.cfg.repo),null,2500);else{if(GH.err)toast(GH.err,'#c0392b',4000);ghPush()}}
function ghChoose(n,cb){const o=document.createElement('div');o.className='ov';o.style.zIndex=40;o.style.alignItems='center';
 o.innerHTML=`<div class="box" style="max-width:700px;text-align:center"><p style="font-size:24px;line-height:1.35;margin:10px 0 18px">Im Cloud-Speicher liegen schon Daten, und hier gibt es ebenfalls welche.<br>Welche sollen gelten?</p><div style="display:flex;flex-direction:column;gap:12px"><button class="g" data-m="pull" style="min-height:84px;font-size:21px">⬇ Cloud-Daten übernehmen<br><small>die lokalen Daten werden ersetzt</small></button><button class="o" data-m="push" style="min-height:84px;font-size:21px">⬆ Lokale Daten hochladen<br><small>die Daten in der Cloud werden ersetzt</small></button><button data-m="cancel" style="min-height:72px;font-size:21px">Abbrechen</button></div></div>`;
 document.body.appendChild(o);o.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{o.remove();cb(b.dataset.m)})}
async function ghFinish(list){GH.st={sha:{},hash:{}};list.forEach(x=>GH.st.sha[x.name]=x.sha);
 const finish=async m=>{localStorage.setItem(GHK,JSON.stringify(GH.cfg));if(m=='pull'){try{localStorage.setItem('navibar-vor-cloud',JSON.stringify(S))}catch(e){}GH.st={sha:{},hash:{}};await ghPull(false)}else await ghPush();GH.state='ok';GH.last=new Date();ghUi();render();toast('Cloud-Speicher verbunden',null,2500)};
 if(!list.length)return finish('push');if(isEmptyS())return finish('pull');
 return new Promise(res=>ghChoose(list.length,async m=>{if(m=='cancel'){GH.cfg=null;GH.st={sha:{},hash:{}};res();return}await finish(m);res()}))}
async function ghConnect(owner,repo,token){GH.cfg={type:'github',owner,repo,token};
 const r=await ghApi('');if(!r.ok){GH.cfg=null;throw new Error(r.status==404||r.status==401||r.status==403?'Zugriff nicht möglich. Benutzername, Repository und Token prüfen.':'GitHub-Fehler '+r.status)}
 const j=await r.json();if(!j.private){GH.cfg=null;throw new Error('Das Repository ist ÖFFENTLICH. Kundendaten dürfen nur in ein privates Repository.')}
 return ghFinish(await ghList())}
async function sbConnect(url,key,email,pw){url=String(url).trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');if(!/^https:\/\/[^\s/]+$/.test(url))throw new Error('Die Project-URL muss mit https:// beginnen, z. B. https://abcd.supabase.co');
 GH.cfg={type:'supabase',url,key:String(key).trim(),email:String(email).trim(),pw,sess:null};let list;
 try{await sbAuth(true)}catch(e){GH.cfg=null;throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'Keine Verbindung zu Supabase. URL und Internet prüfen.':e.message)}
 try{list=await ghList()}catch(e){GH.cfg=null;throw new Error('Die Tabelle nb_files ist nicht erreichbar. Wurde das SQL-Skript im Supabase SQL-Editor ausgeführt? ('+e.message+')')}
 return ghFinish(list)}
const pasteTo=n=>navigator.clipboard.readText().then(t=>{document.querySelector('[name='+n+']').value=t.trim()}).catch(()=>alert('Einfügen nicht erlaubt – bitte von Hand eintippen.'));
function formGh(){modal('GitHub-Speicher einrichten',`<label>GitHub-Benutzername<input name="o" data-nocap="1" placeholder="z. B. max-muster"></label><label>Privates Repository für die Daten<input name="r" data-nocap="1" placeholder="z. B. navibar-daten"></label><label>Zugriffs-Token<input name="t" type="password" placeholder="github_pat_…"></label><div class="row"><button type="button" onclick="pasteTo('t')">📋 Token aus Zwischenablage einfügen</button></div>`,o=>{
 const ow=v(o,'o'),rp=v(o,'r'),tk=v(o,'t');if(!ow||!rp||!tk)return false;toast('Verbinde …',null,1500);
 ghConnect(ow,rp,tk).then(()=>{o.remove();render()}).catch(e=>alert(e.message));return false},'Verbinden')}
function formSb(){modal('Supabase einrichten',`<label>Project-URL<input name="u" data-nocap="1" placeholder="https://abcd.supabase.co"></label><div class="row"><button type="button" onclick="pasteTo('u')">📋 URL einfügen</button></div><label>Anon-/Publishable-Key<input name="k" type="password"></label><div class="row"><button type="button" onclick="pasteTo('k')">📋 Key einfügen</button></div><label>Gerätekonto: E-Mail<input name="e" data-nocap="1" placeholder="kasse@navibar.de"></label><label>Gerätekonto: Passwort<input name="p" type="password"></label>`,o=>{
 const u=v(o,'u'),k=v(o,'k'),e=v(o,'e'),pw=o.querySelector('[name=p]').value;if(!u||!k||!e||!pw)return false;toast('Verbinde …',null,1500);
 sbConnect(u,k,e,pw).then(()=>{o.remove();render()}).catch(er=>alert(er.message));return false},'Verbinden')}
function ghBox(){if(!GH.cfg)return `<p class="mut">Sichert alle Daten zusätzlich in der Cloud und gleicht mehrere Geräte ab (z. B. Laptop und Handy). Die Einrichtung geht am einfachsten am PC mit Tastatur.</p><div class="row"><button class="b" onclick="formSb()">Supabase einrichten</button><button onclick="formGh()">GitHub einrichten</button></div>`;
 return `<p>Verbunden mit <b>${ghName()}</b> (${esc(isSb()?GH.cfg.url.replace('https://',''):GH.cfg.owner+'/'+GH.cfg.repo)}) · Status: <b>${{ok:'synchron',sync:'sendet …',offline:'offline – wartet',err:'Fehler'}[GH.state]||GH.state}</b>${GH.last?' · zuletzt '+GH.last.toLocaleTimeString('de-DE'):''}${ghDirty()?' · <span style="color:var(--orange)">ungesicherte Änderungen</span>':''}</p><div class="row"><button class="g" onclick="ghPush()">Jetzt synchronisieren</button><button class="b" onclick="showCfgQR()">📱 Handy verbinden (QR)</button><button class="r" onclick="ghDisconnect()">Verbindung trennen</button></div>`}
function ghDisconnect(){ask('Cloud-Verbindung trennen?\nDie Daten bleiben lokal erhalten, werden aber nicht mehr in der Cloud gesichert.',()=>{localStorage.removeItem(GHK);localStorage.removeItem(GHS);GH.cfg=null;GH.st={sha:{},hash:{}};ghUi();render()},'Trennen','r')}
/* --- Handy per QR-Code mit dem Cloud-Speicher verbinden (QR enthält die Zugangsdaten: nur kurz zeigen!) --- */
function showCfgQR(){if(!GH.cfg)return;if(!/^https?:/.test(location.protocol)){alert('Das geht nur, wenn die Kasse über ihre Internetadresse (GitHub Pages) geöffnet ist.');return}
 const c=isSb()?{type:'supabase',url:GH.cfg.url,key:GH.cfg.key,email:GH.cfg.email,pw:GH.cfg.pw}:{type:'github',owner:GH.cfg.owner,repo:GH.cfg.repo,token:GH.cfg.token},
 link=location.href.split('#')[0].split('?')[0]+'#cfg='+encodeURIComponent(b64e(JSON.stringify(c)));let cv;try{cv=QR.draw(link)}catch(e){alert('Die Zugangsdaten sind für einen QR-Code zu lang.');return}
 const o=document.createElement('div');o.className='ov';o.style.zIndex=40;o.innerHTML=`<div class="box" style="max-width:520px;text-align:center"><h2 style="margin-top:0">Handy verbinden</h2><p>Mit der Handy-Kamera scannen und den Link öffnen. Das Handy richtet sich dann selbst ein.</p><div id="cq"></div><p style="color:var(--red)"><b>Achtung:</b> Der Code enthält die Zugangsdaten. Nur kurz zeigen, danach schließen.</p><div class="row"><button class="b" id="cqx">Schließen</button></div></div>`;
 document.body.appendChild(o);o.querySelector('#cq').appendChild(cv);o.querySelector('#cqx').onclick=()=>o.remove()}
function ghImportHash(){const m=location.hash.match(/^#cfg=(.+)$/);if(!m)return;let c;
 try{c=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(decodeURIComponent(m[1])),x=>x.charCodeAt(0))))}catch(e){return}
 try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 setTimeout(()=>ask(`Cloud-Speicher (${c.type=='supabase'?'Supabase':'GitHub'}) auf diesem Gerät einrichten?\nDie Kassendaten werden danach abgeglichen.`,()=>{
  (c.type=='supabase'?sbConnect(c.url,c.key,c.email,c.pw):ghConnect(c.owner,c.repo,c.token)).then(()=>render()).catch(e=>alert(e.message))},'Einrichten'),400)}

function devBox(){return `<h3>Dieses Gerät</h3><label>Bildschirmtastatur<select onchange="setKbMode(this.value)" style="margin-top:6px"><option value="auto" ${kbMode()=='auto'?'selected':''}>Automatisch (am Handy die Systemtastatur)</option><option value="on" ${kbMode()=='on'?'selected':''}>Immer die eigene Tastatur</option><option value="off" ${kbMode()=='off'?'selected':''}>Immer die Systemtastatur</option></select></label><div class="row"><button onclick="showAppQR()">📱 Kasse auf dem Handy öffnen (QR)</button></div>`}
function showAppQR(){if(!/^https?:/.test(location.protocol)){alert('Das geht nur, wenn die Kasse über ihre Internetadresse (GitHub Pages) geöffnet ist.');return}
 const u=location.href.split('#')[0].split('?')[0],o=document.createElement('div');o.className='ov';o.style.zIndex=40;o.innerHTML=`<div class="box" style="max-width:520px;text-align:center"><h2 style="margin-top:0">Kasse auf dem Handy öffnen</h2><div id="cq"></div><p class="mut" style="word-break:break-all">${esc(u)}</p><p class="mut">Am Handy im Browser öffnen, dann im Menü „Zum Startbildschirm hinzufügen“ bzw. „App installieren“ wählen.</p><div class="row"><button class="b" id="cqx">Schließen</button></div></div>`;
 document.body.appendChild(o);o.querySelector('#cq').appendChild(QR.draw(u));o.querySelector('#cqx').onclick=()=>o.remove()}

/* ===== Bon-Druck (Thermodrucker, 80 oder 58 mm, über den Druckdialog des installierten Druckers) ===== */
function bonHtml(o){const s=S.bon,t=o.ts||Date.now(),tot=o.entries.reduce((a,e)=>a+e.price*e.qty,0),br=x=>esc(x||'').replace(/\n/g,'<br>');
 return `<div class="bc bb">${br(s.head)}</div><div class="bc">${s.time=='1'?dtf(t):new Date(t).toLocaleDateString('de-DE')}</div><hr><div>#${o.no}${s.name=='1'&&o.name?' '+esc(o.name):''}</div>${s.cashier=='1'&&o.cashier?`<div>Kassierer: ${esc(o.cashier)}</div>`:''}<hr>
 <table>${o.entries.map(e=>`<tr><td>${e.qty}× ${esc(e.label)}</td>${s.prices=='1'?`<td class="r">${eur(e.price*e.qty)}</td>`:''}</tr>`).join('')}</table><hr>
 <div class="bs"><span>SUMME</span><span>${eur(tot)}</span></div>${o.method?`<div>Zahlart: ${esc(o.method)}</div>`:''}${s.foot?`<hr><div class="bc">${br(s.foot)}</div>`:''}<div class="bc">&nbsp;</div>`}
function bonPrint(o){const w=S.bon.width=='58'?58:80,b=$('bonp');b.innerHTML=bonHtml(o);b.style.width=(w-8)+'mm';
 const st=document.createElement('style');st.id='bonpage';st.textContent='@page{size:'+w+'mm auto;margin:3mm}';document.head.appendChild(st);document.body.classList.add('bp');
 const done=()=>{document.body.classList.remove('bp');st.remove();b.innerHTML='';window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
 setTimeout(()=>{try{window.print()}catch(e){done()}},60)}

function zPrint(id){const a=S.archive.find(x=>x.id==id);if(a)bonPrint({no:a.no,name:a.name,cashier:a.cashier,entries:a.entries,method:a.method,ts:a.paidAt})}

  const g=n=>o.querySelector('[name='+n+']').value;S.bon={head:g('h'),foot:g('f'),width:g('w'),name:g('n'),cashier:g('c'),time:g('t'),prices:g('p'),auto:g('a')};save();render()})}
