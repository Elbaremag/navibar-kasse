# Hält das kostenlose Supabase-Projekt wach (es pausiert sonst nach etwa 7 Tagen ohne Nutzung).
# Der Aufruf enthält keine Daten: nb_ping() gibt nur die Uhrzeit zurück.
# Einrichtung: GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret:
#   SUPABASE_URL  = https://DEIN-PROJEKT.supabase.co
#   SUPABASE_KEY  = der anon/publishable Key
name: Supabase wachhalten
on:
  schedule:
    - cron: '17 5 * * 1,4'   # montags und donnerstags, 05:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY" || { echo "Secrets SUPABASE_URL und SUPABASE_KEY fehlen"; exit 1; }
          curl -fsS -X POST "$URL/rest/v1/rpc/nb_ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
